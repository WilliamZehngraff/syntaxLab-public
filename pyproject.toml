[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syntaxlab"
version = "0.1.0"
description = "Local, code-from-scratch programming practice"
requires-python = ">=3.11"
dependencies = ["textual>=0.85,<2", "PyYAML>=6", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13", "types-PyYAML"]

[project.scripts]
syntaxlab = "syntaxlab.cli:main"

[tool.setuptools.packages.find]
include = ["syntaxlab*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
