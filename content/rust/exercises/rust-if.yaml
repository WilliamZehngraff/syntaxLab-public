id: rust-if
language: rust
module: control-flow
title: 01 · If as an expression
order: 90
prerequisites:
- rust-functions-multiple
concepts:
- if
- else
- expressions
- bool
difficulty: 2
assignment: |
  Implement `pub fn larger(a: i32, b: i32) -> i32` with an if/else expression, including equal and negative inputs. Do not call max. Add a runnable demo. Both branches must produce the same result type.

  ## Workflow
  Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. No learner implementation is supplied.
  Read `syntaxlab docs rust control-flow` for syntax and independent examples.

  ```sh
  cargo run
  cargo test
  syntaxlab check
  ```
docs: rust/docs/control-flow.md
hints:
- Rust does not require parentheses around an if condition.
- Leave off the semicolon when a branch's last expression supplies its value.
files:
  Cargo.toml: |
    [package]
    name = "syntaxlab_exercise"
    version = "0.1.0"
    edition = "2021"
    rust-version = "1.70"
  tests/exercise.rs: |
    use syntaxlab_exercise::*;

    #[test]
    fn contract() {
    assert_eq!(larger(2, 7), 7); assert_eq!(larger(-2, -7), -2); assert_eq!(larger(4, 4), 4);
    }
  ASSIGNMENT.md: |
    Implement `pub fn larger(a: i32, b: i32) -> i32` with an if/else expression, including equal and negative inputs. Do not call max. Add a runnable demo. Both branches must produce the same result type.

    ## Workflow
    Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. No learner implementation is supplied.
    Read `syntaxlab docs rust control-flow` for syntax and independent examples.

    ```sh
    cargo run
    cargo test
    syntaxlab check
    ```
checks:
- type: file
  path: src/main.rs
  label: Learner src/main.rs exists
- type: file
  path: src/lib.rs
  label: Learner library exists
- type: command
  args:
  - $cargo
  - test
  - --offline
  label: Cargo compilation and behavior tests
  requires:
  - $cargo
  - $rustc
- type: command
  args:
  - $cargo
  - run
  - --offline
  - --quiet
  label: Application runs
  requires:
  - $cargo
  - $rustc
- type: construct
  path: src/lib.rs
  pattern: \bif\b
  label: Required lesson construct (heuristic; behavior tested separately)
solution:
  src/lib.rs: |
    pub fn larger(a: i32, b: i32) -> i32 { if a >= b { a } else { b } }
  src/main.rs: |
    use syntaxlab_exercise::*;
    fn main() { println!("{:?}", larger(2, 7)); }
project: ''
