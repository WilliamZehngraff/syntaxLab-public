id: rust-methods
language: rust
module: structs
title: 02 · Constructors and instance methods
order: 200
prerequisites:
- rust-structs
concepts:
- impl
- associated-functions
- self
- methods
- encapsulation
difficulty: 3
assignment: |
  Define public Counter with private count: i32. In its impl, provide `pub fn new(start: i32) -> Self`, `pub fn value(&self) -> i32` and `pub fn increment(&mut self)`. Two counters must be independent. Add a demo with Counter::new, then call methods using dot syntax.

  ## Workflow
  Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. No learner implementation is supplied.
  Read `syntaxlab docs rust structs` for syntax and independent examples.

  ```sh
  cargo run
  cargo test
  syntaxlab check
  ```
docs: rust/docs/structs.md
hints:
- new is a naming convention for an associated constructor, not a keyword.
- Use &self to inspect and &mut self to change instance state.
files:
  Cargo.toml: |
    [package]
    name = "syntaxlab_exercise"
    version = "0.1.0"
    edition = "2021"
    rust-version = "1.70"
  tests/exercise.rs: |
    use syntaxlab_exercise::*;

    #[test]
    fn contract() {
    let mut a = Counter::new(3); let b = Counter::new(8); a.increment(); a.increment(); assert_eq!(a.value(), 5); assert_eq!(b.value(), 8);
    }
  ASSIGNMENT.md: |
    Define public Counter with private count: i32. In its impl, provide `pub fn new(start: i32) -> Self`, `pub fn value(&self) -> i32` and `pub fn increment(&mut self)`. Two counters must be independent. Add a demo with Counter::new, then call methods using dot syntax.

    ## Workflow
    Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. No learner implementation is supplied.
    Read `syntaxlab docs rust structs` for syntax and independent examples.

    ```sh
    cargo run
    cargo test
    syntaxlab check
    ```
checks:
- type: file
  path: src/main.rs
  label: Learner src/main.rs exists
- type: file
  path: src/lib.rs
  label: Learner library exists
- type: command
  args:
  - $cargo
  - test
  - --offline
  label: Cargo compilation and behavior tests
  requires:
  - $cargo
  - $rustc
- type: command
  args:
  - $cargo
  - run
  - --offline
  - --quiet
  label: Application runs
  requires:
  - $cargo
  - $rustc
solution:
  src/lib.rs: |
    pub struct Counter { count: i32 }
    impl Counter { pub fn new(start: i32) -> Self { Self { count: start } } pub fn value(&self) -> i32 { self.count } pub fn increment(&mut self) { self.count += 1; } }
  src/main.rs: |
    use syntaxlab_exercise::*;
    fn main() { println!("{:?}", Counter::new(3).value()); }
project: ''
