id: rust-mutable-borrow
language: rust
module: ownership
title: 03 · Mutate through an exclusive borrow
order: 140
prerequisites:
- rust-borrowing
concepts:
- mutable-borrow
- String
- push
- unit
difficulty: 2
assignment: |
  Write `pub fn add_mark(text: &mut String)` appending one exclamation mark to the caller's String. Return unit. Repeated calls append repeated marks. Add a demo that creates a mutable String and passes &mut to it; keep the borrow's scope small.

  ## Workflow
  Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. No learner implementation is supplied.
  Read `syntaxlab docs rust ownership` for syntax and independent examples.

  ```sh
  cargo run
  cargo test
  syntaxlab check
  ```
docs: rust/docs/ownership.md
hints:
- The caller's binding and the parameter's borrow both need to allow mutation.
- You may have one active exclusive borrow, or shared borrows, not both at once.
files:
  Cargo.toml: |
    [package]
    name = "syntaxlab_exercise"
    version = "0.1.0"
    edition = "2021"
    rust-version = "1.70"
  tests/exercise.rs: |
    use syntaxlab_exercise::*;

    #[test]
    fn contract() {
    let mut text = String::from("Read"); add_mark(&mut text); add_mark(&mut text); assert_eq!(text, "Read!!"); let mut empty = String::new(); add_mark(&mut empty); assert_eq!(empty, "!");
    }
  ASSIGNMENT.md: |
    Write `pub fn add_mark(text: &mut String)` appending one exclamation mark to the caller's String. Return unit. Repeated calls append repeated marks. Add a demo that creates a mutable String and passes &mut to it; keep the borrow's scope small.

    ## Workflow
    Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. No learner implementation is supplied.
    Read `syntaxlab docs rust ownership` for syntax and independent examples.

    ```sh
    cargo run
    cargo test
    syntaxlab check
    ```
checks:
- type: file
  path: src/main.rs
  label: Learner src/main.rs exists
- type: file
  path: src/lib.rs
  label: Learner library exists
- type: command
  args:
  - $cargo
  - test
  - --offline
  label: Cargo compilation and behavior tests
  requires:
  - $cargo
  - $rustc
- type: command
  args:
  - $cargo
  - run
  - --offline
  - --quiet
  label: Application runs
  requires:
  - $cargo
  - $rustc
solution:
  src/lib.rs: |
    pub fn add_mark(text: &mut String) { text.push('!'); }
  src/main.rs: |
    use syntaxlab_exercise::*;
    fn main() { println!("{:?}", { let mut text = String::from("Read"); add_mark(&mut text); text }); }
project: ''
