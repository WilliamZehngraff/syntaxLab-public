id: rust-while
language: rust
module: control-flow
title: 03 · While and progress toward termination
order: 110
prerequisites:
- rust-for
concepts:
- while
- mutable-parameters
- integer-division
difficulty: 2
assignment: |
  Implement `pub fn digit_count(mut n: u32) -> u32` with while, counting decimal digits without converting to a string. Zero has one digit. Add a demo and a comment identifying the step that moves toward termination.

  ## Workflow
  Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. No learner implementation is supplied.
  Read `syntaxlab docs rust control-flow` for syntax and independent examples.

  ```sh
  cargo run
  cargo test
  syntaxlab check
  ```
docs: rust/docs/control-flow.md
hints:
- A parameter can be mutable inside its function without changing the caller's number.
- Integer division by ten removes a digit.
files:
  Cargo.toml: |
    [package]
    name = "syntaxlab_exercise"
    version = "0.1.0"
    edition = "2021"
    rust-version = "1.70"
  tests/exercise.rs: |
    use syntaxlab_exercise::*;

    #[test]
    fn contract() {
    assert_eq!(digit_count(0), 1); assert_eq!(digit_count(9), 1); assert_eq!(digit_count(10), 2); assert_eq!(digit_count(1200), 4);
    }
  ASSIGNMENT.md: |
    Implement `pub fn digit_count(mut n: u32) -> u32` with while, counting decimal digits without converting to a string. Zero has one digit. Add a demo and a comment identifying the step that moves toward termination.

    ## Workflow
    Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. No learner implementation is supplied.
    Read `syntaxlab docs rust control-flow` for syntax and independent examples.

    ```sh
    cargo run
    cargo test
    syntaxlab check
    ```
checks:
- type: file
  path: src/main.rs
  label: Learner src/main.rs exists
- type: file
  path: src/lib.rs
  label: Learner library exists
- type: command
  args:
  - $cargo
  - test
  - --offline
  label: Cargo compilation and behavior tests
  requires:
  - $cargo
  - $rustc
- type: command
  args:
  - $cargo
  - run
  - --offline
  - --quiet
  label: Application runs
  requires:
  - $cargo
  - $rustc
- type: construct
  path: src/lib.rs
  pattern: \bwhile\b
  label: Required lesson construct (heuristic; behavior tested separately)
solution:
  src/lib.rs: |
    pub fn digit_count(mut n: u32) -> u32 { let mut count = 1; while n >= 10 { n /= 10; count += 1; } count }
  src/main.rs: |
    use syntaxlab_exercise::*;
    fn main() { println!("{:?}", digit_count(1200)); }
project: ''
