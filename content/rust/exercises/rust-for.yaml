id: rust-for
language: rust
module: control-flow
title: 02 · For loops and inclusive ranges
order: 100
prerequisites:
- rust-if
concepts:
- for
- ranges
- mut
- accumulation
difficulty: 2
assignment: |
  Write `pub fn sum_to(n: u32) -> u32` using a for loop to sum 1 through n for n <= 1000. sum_to(0) is 0. Do not use Iterator::sum. Keep the accumulator local and add a demo.

  ## Workflow
  Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. No learner implementation is supplied.
  Read `syntaxlab docs rust control-flow` for syntax and independent examples.

  ```sh
  cargo run
  cargo test
  syntaxlab check
  ```
docs: rust/docs/control-flow.md
hints:
- a..b excludes b; a..=b includes it.
- The result is the accumulated value after the loop.
files:
  Cargo.toml: |
    [package]
    name = "syntaxlab_exercise"
    version = "0.1.0"
    edition = "2021"
    rust-version = "1.70"
  tests/exercise.rs: |
    use syntaxlab_exercise::*;

    #[test]
    fn contract() {
    assert_eq!(sum_to(0), 0); assert_eq!(sum_to(5), 15); assert_eq!(sum_to(100), 5050);
    }
  ASSIGNMENT.md: |
    Write `pub fn sum_to(n: u32) -> u32` using a for loop to sum 1 through n for n <= 1000. sum_to(0) is 0. Do not use Iterator::sum. Keep the accumulator local and add a demo.

    ## Workflow
    Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. No learner implementation is supplied.
    Read `syntaxlab docs rust control-flow` for syntax and independent examples.

    ```sh
    cargo run
    cargo test
    syntaxlab check
    ```
checks:
- type: file
  path: src/main.rs
  label: Learner src/main.rs exists
- type: file
  path: src/lib.rs
  label: Learner library exists
- type: command
  args:
  - $cargo
  - test
  - --offline
  label: Cargo compilation and behavior tests
  requires:
  - $cargo
  - $rustc
- type: command
  args:
  - $cargo
  - run
  - --offline
  - --quiet
  label: Application runs
  requires:
  - $cargo
  - $rustc
- type: construct
  path: src/lib.rs
  pattern: \bfor\b
  label: Required lesson construct (heuristic; behavior tested separately)
solution:
  src/lib.rs: |
    pub fn sum_to(n: u32) -> u32 { let mut total = 0; for value in 1..=n { total += value; } total }
  src/main.rs: |
    use syntaxlab_exercise::*;
    fn main() { println!("{:?}", sum_to(5)); }
project: ''
