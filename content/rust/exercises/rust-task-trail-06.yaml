id: rust-task-trail-06
language: rust
module: projects
title: 06 · A task record
order: 191
prerequisites:
- rust-structs
- rust-task-trail-05
concepts:
- struct
- derive
- owned-fields
difficulty: 3
assignment: |
  Define public Task with public id: u32, title: String and done: bool fields. Derive Debug, Clone, PartialEq and Eq. Add `pub fn task_create(id: u32, title: String) -> Task`, initially undone. Inputs have positive IDs and nonblank titles. Keep earlier string helpers available.

  ## Workflow
  Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. Extend the same project; preserve earlier APIs and stage tests.
  Read `syntaxlab docs rust projects` for syntax and independent examples.

  ```sh
  cargo run
  cargo test
  syntaxlab check
  ```
docs: rust/docs/projects.md
hints:
- Preserve earlier APIs; let the accumulated tests protect them during each extension.
- Decide which values are owned, borrowed or fallible before choosing the function signatures.
files:
  Cargo.toml: |
    [package]
    name = "task_trail"
    version = "0.1.0"
    edition = "2021"
    rust-version = "1.70"
  tests/stage_06.rs: |
    use task_trail::*;

    #[test]
    fn stage_contract() {
    let task = task_create(7, "Read".to_owned()); assert_eq!(task.id, 7); assert_eq!(task.title, "Read"); assert!(!task.done); assert_eq!(task.clone(), task);
    }
  STAGE-06.md: |
    Define public Task with public id: u32, title: String and done: bool fields. Derive Debug, Clone, PartialEq and Eq. Add `pub fn task_create(id: u32, title: String) -> Task`, initially undone. Inputs have positive IDs and nonblank titles. Keep earlier string helpers available.

    ## Workflow
    Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. Extend the same project; preserve earlier APIs and stage tests.
    Read `syntaxlab docs rust projects` for syntax and independent examples.

    ```sh
    cargo run
    cargo test
    syntaxlab check
