id: rust-task-trail-07
language: rust
module: projects
title: 07 · A Board owns the tasks
order: 201
prerequisites:
- rust-methods
- rust-task-trail-06
concepts:
- impl
- self
- constructors
- encapsulation
difficulty: 3
assignment: |
  Add public Board with private storage. Provide `pub fn new() -> Self`, `pub fn tasks(&self) -> &[Task]`, and `pub fn add(&mut self, title: String) -> u32`, storing a new task and returning its ID. IDs start at 1 and increase. Two boards must be independent; inputs are valid titles and fewer than 1000 tasks.

  ## Workflow
  Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. Extend the same project; preserve earlier APIs and stage tests.
  Read `syntaxlab docs rust projects` for syntax and independent examples.

  ```sh
  cargo run
  cargo test
  syntaxlab check
  ```
docs: rust/docs/projects.md
hints:
- Preserve earlier APIs; let the accumulated tests protect them during each extension.
- Decide which values are owned, borrowed or fallible before choosing the function signatures.
