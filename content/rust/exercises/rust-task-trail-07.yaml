    let mut a = Board::new(); let b = Board::new(); assert_eq!(a.add("Read".to_owned()), 1); assert_eq!(a.add("Write".to_owned()), 2); assert_eq!(a.tasks().len(), 2); assert!(b.tasks().is_empty());
    }
