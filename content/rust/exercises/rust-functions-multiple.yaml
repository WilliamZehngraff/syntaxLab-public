id: rust-functions-multiple
language: rust
module: functions
title: 02 · Multiple parameters
order: 80
prerequisites:
- rust-functions-basic
concepts:
- multiple-parameters
- u32
- functions
difficulty: 2
assignment: |
  Implement `pub fn rectangle_area(width: u32, height: u32) -> u32` for dimensions 0..1000. Return the area, including zero-sized rectangles. Add a runnable demo. Unsigned integers express the nonnegative domain; each parameter needs its own type.

  ## Workflow
  Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. No learner implementation is supplied.
  Read `syntaxlab docs rust functions` for syntax and independent examples.

  ```sh
  cargo run
  cargo test
  syntaxlab check
  ```
docs: rust/docs/functions.md
hints:
- Separate typed parameters with commas.
- Use both dimensions; nonsquare test cases detect accidentally squaring one side.
files:
  Cargo.toml: |
    [package]
    name = "syntaxlab_exercise"
    version = "0.1.0"
    edition = "2021"
    rust-version = "1.70"
  tests/exercise.rs: |
    use syntaxlab_exercise::*;

    #[test]
    fn contract() {
    assert_eq!(rectangle_area(3, 8), 24); assert_eq!(rectangle_area(0, 9), 0); assert_eq!(rectangle_area(11, 2), 22);
    }
  ASSIGNMENT.md: |
    Implement `pub fn rectangle_area(width: u32, height: u32) -> u32` for dimensions 0..1000. Return the area, including zero-sized rectangles. Add a runnable demo. Unsigned integers express the nonnegative domain; each parameter needs its own type.

    ## Workflow
    Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. No learner implementation is supplied.
    Read `syntaxlab docs rust functions` for syntax and independent examples.

    ```sh
    cargo run
    cargo test
    syntaxlab check
    ```
checks:
- type: file
  path: src/main.rs
  label: Learner src/main.rs exists
- type: file
  path: src/lib.rs
  label: Learner library exists
- type: command
  args:
  - $cargo
  - test
  - --offline
  label: Cargo compilation and behavior tests
  requires:
  - $cargo
  - $rustc
- type: command
  args:
  - $cargo
  - run
  - --offline
  - --quiet
  label: Application runs
  requires:
  - $cargo
  - $rustc
solution:
  src/lib.rs: |
    pub fn rectangle_area(width: u32, height: u32) -> u32 { width * height }
  src/main.rs: |
    use syntaxlab_exercise::*;
    fn main() { println!("{:?}", rectangle_area(3, 8)); }
project: ''
