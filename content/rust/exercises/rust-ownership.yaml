solution:
  src/lib.rs: |
    pub fn greet(name: String) -> String { format!("Hi, {name}") }
  src/main.rs: |
    use syntaxlab_exercise::*;
    fn main() { println!("{:?}", greet(String::from("Ada"))); }
project: ''
