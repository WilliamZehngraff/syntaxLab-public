id: rust-ownership
language: rust
module: ownership
title: 01 · Moving an owned String
order: 120
prerequisites:
- rust-while
concepts:
- ownership
- move
- String
- drop
difficulty: 2
assignment: |
  Write `pub fn greet(name: String) -> String`, returning `Hi, NAME` without trimming. This takes ownership of name. In your demo pass a String, then use only the returned greeting. Experiment with using the moved input and read the compiler's explanation; do not solve every ownership problem by cloning.

  ## Workflow
  Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. No learner implementation is supplied.
  Read `syntaxlab docs rust ownership` for syntax and independent examples.

  ```sh
  cargo run
  cargo test
  syntaxlab check
  ```
docs: rust/docs/ownership.md
hints:
- String owns its allocation; &str borrows text.
- A by-value String parameter takes ownership unless the caller explicitly clones.
files:
  Cargo.toml: |
    [package]
    name = "syntaxlab_exercise"
    version = "0.1.0"
    edition = "2021"
    rust-version = "1.70"
  tests/exercise.rs: |
    use syntaxlab_exercise::*;

    #[test]
    fn contract() {
    assert_eq!(greet(String::from("Ada")), "Hi, Ada"); assert_eq!(greet(String::new()), "Hi, ");
    }
  ASSIGNMENT.md: |
    Write `pub fn greet(name: String) -> String`, returning `Hi, NAME` without trimming. This takes ownership of name. In your demo pass a String, then use only the returned greeting. Experiment with using the moved input and read the compiler's explanation; do not solve every ownership problem by cloning.

    ## Workflow
    Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. No learner implementation is supplied.
    Read `syntaxlab docs rust ownership` for syntax and independent examples.

    ```sh
    cargo run
    cargo test
    syntaxlab check
    ```
checks:
