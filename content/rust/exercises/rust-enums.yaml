id: rust-enums
language: rust
module: enums
title: 01 · Enums and exhaustive matching
order: 220
prerequisites:
- rust-traits
concepts:
- enum
- match
- exhaustiveness
- derive
difficulty: 4
assignment: |
  Define public enum Direction with North, East, South and West, deriving Debug and PartialEq. Write `pub fn turn_right(direction: Direction) -> Direction` performing a clockwise quarter turn with match. Cover every variant explicitly and add a demo.

  ## Workflow
  Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. No learner implementation is supplied.
  Read `syntaxlab docs rust enums` for syntax and independent examples.

  ```sh
  cargo run
  cargo test
  syntaxlab check
  ```
docs: rust/docs/enums.md
hints:
- Qualify a variant with its enum name and ::.
- The compiler tells you which match variants are missing.
files:
  Cargo.toml: |
    [package]
    name = "syntaxlab_exercise"
    version = "0.1.0"
    edition = "2021"
    rust-version = "1.70"
  tests/exercise.rs: |
    use syntaxlab_exercise::*;

    #[test]
    fn contract() {
    assert_eq!(turn_right(Direction::North), Direction::East); assert_eq!(turn_right(Direction::East), Direction::South); assert_eq!(turn_right(Direction::South), Direction::West); assert_eq!(turn_right(Direction::West), Direction::North);
    }
  ASSIGNMENT.md: |
    Define public enum Direction with North, East, South and West, deriving Debug and PartialEq. Write `pub fn turn_right(direction: Direction) -> Direction` performing a clockwise quarter turn with match. Cover every variant explicitly and add a demo.

    ## Workflow
    Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. No learner implementation is supplied.
    Read `syntaxlab docs rust enums` for syntax and independent examples.

    ```sh
    cargo run
    cargo test
    syntaxlab check
    ```
checks:
- type: file
  path: src/main.rs
  label: Learner src/main.rs exists
- type: file
  path: src/lib.rs
  label: Learner library exists
- type: command
  args:
  - $cargo
  - test
  - --offline
  label: Cargo compilation and behavior tests
  requires:
  - $cargo
  - $rustc
- type: command
  args:
  - $cargo
  - run
  - --offline
  - --quiet
  label: Application runs
  requires:
  - $cargo
  - $rustc
- type: construct
  path: src/lib.rs
  pattern: \bmatch\b
  label: Required lesson construct (heuristic; behavior tested separately)
solution:
  src/lib.rs: |
    #[derive(Debug, PartialEq)]
    pub enum Direction { North, East, South, West }
    pub fn turn_right(direction: Direction) -> Direction { match direction { Direction::North => Direction::East, Direction::East => Direction::South, Direction::South => Direction::West, Direction::West => Direction::North } }
  src/main.rs: |
    use syntaxlab_exercise::*;
    fn main() { println!("{:?}", turn_right(Direction::North)); }
project: ''
