solution:
  src/lib.rs: |
    pub fn remaining(used: u32) -> u32 { 10 - used }
    pub fn can_add(used: i32) -> bool { used >= 0 && used < 10 }
    pub fn add_title(titles: &[String], title: String) -> Vec<String> { let mut result = titles.to_vec(); result.push(title); result }
    pub fn render_titles(titles: &[String]) -> String { titles.iter().map(|title| format!("[ ] {title}")).collect::<Vec<_>>().join("\n") }
    #[derive(Debug, Clone, PartialEq, Eq)]
    pub struct Task { pub id: u32, pub title: String, pub done: bool }
    pub fn task_create(id: u32, title: String) -> Task { Task { id, title, done: false } }
    pub fn render_task(task: &Task) -> String {
        format!("{}\t{}\t{}", task.id, if task.done { 1 } else { 0 }, task.title)
    }
    pub fn parse_task(line: &str) -> Result<Task, String> {
        let fields: Vec<&str> = line.split('\t').collect();
        if fields.len() != 3 { return Err("expected three fields".to_owned()); }
        let id = fields[0].parse::<u32>().map_err(|_| "invalid ID".to_owned())?;
        if id == 0 { return Err("ID must be positive".to_owned()); }
        let done = match fields[1] { "0" => false, "1" => true, _ => return Err("invalid status".to_owned()) };
        let title = fields[2];
        if title.trim().is_empty() || title.chars().any(|c| c == '\n' || c == '\r') {
            return Err("invalid title".to_owned());
        }
        Ok(Task { id, title: title.to_owned(), done })
    }

    mod board;
    pub use board::Board;
    use std::{fs, io, path::Path};
    use std::collections::HashSet;

    pub fn save_board(path: &Path, board: &Board) -> Result<(), String> {
        let text: String = board.tasks().iter().map(|task| format!("{}\n", render_task(task))).collect();
        fs::write(path, text).map_err(|error| error.to_string())
    }
    pub fn load_board(path: &Path) -> Result<Board, String> {
        let text = match fs::read_to_string(path) {
            Ok(text) => text,
            Err(error) if error.kind() == io::ErrorKind::NotFound => return Ok(Board::new()),
            Err(error) => return Err(error.to_string()),
        };
        let mut tasks = Vec::new();
        let mut ids = HashSet::new();
        for line in text.lines() {
            let task = parse_task(line)?;
            if !ids.insert(task.id) { return Err("duplicate ID".to_owned()); }
            tasks.push(task);
        }
        Ok(Board::from_tasks(tasks))
    }
  src/main.rs: |
    use std::path::Path;
    use task_trail::{load_board, save_board, parse_task};

    fn execute(args: &[String]) -> Result<(), String> {
        if args.is_empty() { println!("Task Trail ready"); return Ok(()); }
        if args.len() < 2 { return Err("Usage: list FILE | add FILE TITLE | done FILE ID".to_owned()); }
        let path = Path::new(&args[1]);
        let mut board = load_board(path)?;
        match args[0].as_str() {
            "list" if args.len() == 2 => {
                for task in board.tasks() {
                    println!("{} [{}] {}", task.id, if task.done { "x" } else { " " }, task.title);
                }
            }
            "add" if args.len() == 3 => {
                parse_task(&format!("1\t0\t{}", args[2]))?;
                if board.tasks().iter().any(|task| task.id == u32::MAX) { return Err("ID space exhausted".to_owned()); }
                let id = board.add(args[2].clone());
                save_board(path, &board)?;
                println!("Added {id}");
            }
            "done" if args.len() == 3 => {
                let id = args[2].parse::<u32>().map_err(|_| "invalid ID".to_owned())?;
                if !board.complete(id) { return Err("task not found".to_owned()); }
                save_board(path, &board)?;
                println!("Completed");
            }
            _ => return Err("invalid command or arguments".to_owned()),
        }
        Ok(())
    }
    fn main() {
        let args: Vec<String> = std::env::args().skip(1).collect();
        if let Err(error) = execute(&args) { eprintln!("Task Trail: {error}"); std::process::exit(1); }
    }
  src/board.rs: |
    use crate::{Task, task_create};
    pub struct Board { tasks: Vec<Task> }
    impl Board {
        pub fn new() -> Self { Self { tasks: Vec::new() } }
        pub fn tasks(&self) -> &[Task] { &self.tasks }
        pub fn add(&mut self, title: String) -> u32 {
            let mut id = 1;
            for task in &self.tasks { if task.id >= id { id = task.id + 1; } }
            self.tasks.push(task_create(id, title));
            id
        }

        pub fn find(&self, id: u32) -> Option<&Task> { self.tasks.iter().find(|task| task.id == id) }
        pub fn complete(&mut self, id: u32) -> bool {
            for task in &mut self.tasks {
                if task.id == id { task.done = true; return true; }
            }
            false
        }

        pub fn from_tasks(tasks: Vec<Task>) -> Self { Self { tasks } }
    }
  tests/learner.rs: |
    use task_trail::parse_task;
    #[test]
    fn malformed_record() { assert!(parse_task("invalid").is_err()); }
