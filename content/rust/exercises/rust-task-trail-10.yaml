  tests/cli.rs: |
    use std::{path::Path, process::{Command, Output}};
    fn call(path: &Path, command: &str, extra: Option<&str>) -> Output {
        let mut process = Command::new(env!("CARGO_BIN_EXE_task_trail"));
        process.arg(command).arg(path);
        if let Some(value) = extra { process.arg(value); }
        process.output().unwrap()
    }
    fn successful(output: Output) -> String {
        assert!(output.status.success(), "{}", String::from_utf8_lossy(&output.stderr));
        String::from_utf8(output.stdout).unwrap().trim().to_owned()
    }
    #[test]
    fn cli_round_trip_and_failure_paths() {
        let path = std::env::temp_dir().join(format!("syntaxlab-cli-{}-{}.txt", std::process::id(),
            std::time::SystemTime::now().duration_since(std::time::UNIX_EPOCH).unwrap().as_nanos()));
        assert_eq!(successful(call(&path, "list", None)), "");
        assert_eq!(successful(call(&path, "add", Some("Read café"))), "Added 1");
        assert_eq!(successful(call(&path, "add", Some("Write tests"))), "Added 2");
        assert_eq!(successful(call(&path, "done", Some("1"))), "Completed");
        assert_eq!(successful(call(&path, "list", None)), "1 [x] Read café\n2 [ ] Write tests");
        for (command, extra) in [("done", "99"), ("done", "oops"), ("add", " "), ("add", "A\tB")] {
            let output = call(&path, command, Some(extra));
            assert!(!output.status.success());
            assert!(!output.stderr.is_empty());
        }
        std::fs::write(&path, "broken").unwrap();
        assert!(!call(&path, "add", Some("Keep data")).status.success());
        assert_eq!(std::fs::read_to_string(&path).unwrap(), "broken");
        std::fs::write(&path, "4294967295\t0\tLast ID\n").unwrap();
        assert!(!call(&path, "add", Some("Overflow")).status.success());
        std::fs::remove_file(&path).unwrap();
    }
  tests/persistence.rs: |
    use task_trail::*;
    #[test]
    fn persistence_preserves_ids_and_rejects_duplicates() {
        let path = std::env::temp_dir().join(format!("syntaxlab-board-{}-{}.txt", std::process::id(),
            std::time::SystemTime::now().duration_since(std::time::UNIX_EPOCH).unwrap().as_nanos()));
        assert!(load_board(&path).unwrap().tasks().is_empty());
        std::fs::write(&path, "7\t1\tExisting\n").unwrap();
        let mut board = load_board(&path).unwrap();
        assert_eq!(board.add("New".to_owned()), 8);
        save_board(&path, &board).unwrap();
        assert_eq!(load_board(&path).unwrap().tasks(), board.tasks());
        std::fs::write(&path, "1\t0\tA\n1\t1\tB\n").unwrap();
        assert!(load_board(&path).is_err());
        std::fs::remove_file(&path).unwrap();
    }
