assignment: |
  Move Board and its impl into src/board.rs and re-export Board from lib.rs. Add `pub fn save_board(path: &std::path::Path, board: &Board) -> Result<(), String>` writing one stage-09 record per line, and `pub fn load_board(path: &std::path::Path) -> Result<Board, String>`. A missing file means an empty board; malformed, duplicate-ID or unreadable existing files fail. Preserve IDs/order; the next add uses max existing ID + 1. Implement binary commands `list FILE`, `add FILE TITLE`, `done FILE ID`: list prints `ID [ ] TITLE` or `ID [x] TITLE`; add saves and prints `Added ID`; done saves and prints `Completed`. Bad arguments, blank/control-character titles, missing IDs, exhausted u32 IDs and I/O errors exit nonzero with a stderr diagnostic. Do not overwrite corrupt files on failure. Keep no-argument banner and earlier APIs. Add tests/learner.rs with your own error-path test. No external crates are needed.

  ## Workflow
  Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. Extend the same project; preserve earlier APIs and stage tests.
  Read `syntaxlab docs rust projects` for syntax and independent examples.

  ```sh
  cargo run
  cargo test
  syntaxlab check
  ```
docs: rust/docs/projects.md
