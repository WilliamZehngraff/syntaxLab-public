id: rust-bindings
language: rust
module: foundations
title: 02 · Immutable and mutable bindings
order: 20
prerequisites:
- rust-hello
concepts:
- let
- mut
- assignment
- immutability
difficulty: 1
assignment: |
  In main, bind a mutable count to 3, increment it twice, then print 5 once. Use let mut, not a hardcoded output. Add an immutable binding for the increment of 1. Rust bindings are immutable by default; make the compiler show you what happens if you remove mut.

  ## Workflow
  Create `src/main.rs` yourself. No learner implementation is supplied.
  Read `syntaxlab docs rust foundations` for syntax and independent examples.

  ```sh
  cargo run
  cargo test
  syntaxlab check
  ```
docs: rust/docs/foundations.md
hints:
- let introduces a binding; mut permits reassignment.
- Formatting can capture a name using {name}.
files:
  Cargo.toml: |
    [package]
    name = "syntaxlab_exercise"
    version = "0.1.0"
    edition = "2021"
    rust-version = "1.70"
  tests/exercise.rs: |
    #[test]
    fn application_output() {
        let output = std::process::Command::new(env!("CARGO_BIN_EXE_syntaxlab_exercise")).output().unwrap();
        assert!(output.status.success(), "{}", String::from_utf8_lossy(&output.stderr));
        assert_eq!(String::from_utf8(output.stdout).unwrap(), "5\n");
    }
  ASSIGNMENT.md: |
    In main, bind a mutable count to 3, increment it twice, then print 5 once. Use let mut, not a hardcoded output. Add an immutable binding for the increment of 1. Rust bindings are immutable by default; make the compiler show you what happens if you remove mut.

    ## Workflow
    Create `src/main.rs` yourself. No learner implementation is supplied.
    Read `syntaxlab docs rust foundations` for syntax and independent examples.

    ```sh
    cargo run
    cargo test
    syntaxlab check
    ```
checks:
- type: file
  path: src/main.rs
  label: Learner src/main.rs exists
- type: command
  args:
  - $cargo
  - test
  - --offline
  label: Cargo compilation and behavior tests
  requires:
  - $cargo
  - $rustc
- type: command
  args:
  - $cargo
  - run
  - --offline
  - --quiet
  label: Application runs
  requires:
  - $cargo
  - $rustc
- type: construct
  path: src/main.rs
  pattern: \blet\s+mut\b
  label: Required lesson construct (heuristic; behavior tested separately)
solution:
  src/main.rs: |
    fn main() { let step = 1; let mut count = 3; count += step; count += step; println!("{count}"); }
project: ''
