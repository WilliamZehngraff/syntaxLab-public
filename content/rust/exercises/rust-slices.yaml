id: rust-slices
language: rust
module: ownership
title: 04 · Borrow a sequence without owning it
order: 150
prerequisites:
- rust-mutable-borrow
concepts:
- slice
- array
- borrow
- indexing
difficulty: 3
assignment: |
  Implement `pub fn first_or_zero(values: &[i32]) -> i32`. Return the first element or zero for an empty slice, without changing any input. Use an emptiness check before indexing. Demonstrate passing an array slice; the same interface will later accept a borrowed Vec.

  ## Workflow
  Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. No learner implementation is supplied.
  Read `syntaxlab docs rust ownership` for syntax and independent examples.

  ```sh
  cargo run
  cargo test
  syntaxlab check
  ```
docs: rust/docs/ownership.md
hints:
- A slice borrows a contiguous region and knows its length.
- An empty slice must be handled before accessing index zero.
files:
  Cargo.toml: |
    [package]
    name = "syntaxlab_exercise"
    version = "0.1.0"
    edition = "2021"
    rust-version = "1.70"
  tests/exercise.rs: |
    use syntaxlab_exercise::*;

    #[test]
    fn contract() {
    let values = [4, 8, 12]; assert_eq!(first_or_zero(&values), 4); assert_eq!(first_or_zero(&values[1..]), 8); assert_eq!(first_or_zero(&[]), 0); assert_eq!(values, [4, 8, 12]);
    }
  ASSIGNMENT.md: |
    Implement `pub fn first_or_zero(values: &[i32]) -> i32`. Return the first element or zero for an empty slice, without changing any input. Use an emptiness check before indexing. Demonstrate passing an array slice; the same interface will later accept a borrowed Vec.

    ## Workflow
    Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. No learner implementation is supplied.
    Read `syntaxlab docs rust ownership` for syntax and independent examples.

    ```sh
    cargo run
    cargo test
    syntaxlab check
    ```
checks:
- type: file
  path: src/main.rs
  label: Learner src/main.rs exists
- type: file
  path: src/lib.rs
  label: Learner library exists
- type: command
  args:
  - $cargo
  - test
  - --offline
  label: Cargo compilation and behavior tests
  requires:
  - $cargo
  - $rustc
- type: command
  args:
  - $cargo
  - run
  - --offline
  - --quiet
  label: Application runs
  requires:
  - $cargo
  - $rustc
solution:
  src/lib.rs: |
    pub fn first_or_zero(values: &[i32]) -> i32 { if values.is_empty() { 0 } else { values[0] } }
  src/main.rs: |
    use syntaxlab_exercise::*;
    fn main() { println!("{:?}", first_or_zero(&[4, 8])); }
project: ''
