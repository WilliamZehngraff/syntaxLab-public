difficulty: 4
assignment: |
  Add `pub fn render_task(task: &Task) -> String` formatting `ID<TAB>STATUS<TAB>TITLE` with STATUS 0/1 and no newline. Add `pub fn parse_task(line: &str) -> Result<Task, String>`. Require exactly three tab-separated fields, a positive u32 ID, status exactly 0 or 1, and a nonblank title without tabs/newlines/carriage returns. Preserve title text. Invalid input returns a nonempty error instead of panicking.

  ## Workflow
  Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. Extend the same project; preserve earlier APIs and stage tests.
  Read `syntaxlab docs rust projects` for syntax and independent examples.

  ```sh
  cargo run
  cargo test
  syntaxlab check
  ```
docs: rust/docs/projects.md
hints:
- Preserve earlier APIs; let the accumulated tests protect them during each extension.
- Decide which values are owned, borrowed or fallible before choosing the function signatures.
