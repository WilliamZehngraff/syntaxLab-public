solution:
  src/lib.rs: |
    use std::{fs, io, path::Path};
    pub fn save_lines(path: &Path, lines: &[String]) -> io::Result<()> { let text: String = lines.iter().map(|line| format!("{line}\n")).collect(); fs::write(path, text) }
    pub fn load_lines(path: &Path) -> io::Result<Vec<String>> { Ok(fs::read_to_string(path)?.lines().map(str::to_owned).collect()) }
  src/main.rs: |
    fn main() { println!("Run cargo test to check the library contract."); }
project: ''
