solution:
  src/lib.rs: |
    pub fn remaining(used: u32) -> u32 { 10 - used }
    pub fn can_add(used: i32) -> bool { used >= 0 && used < 10 }
    pub fn add_title(titles: &[String], title: String) -> Vec<String> { let mut result = titles.to_vec(); result.push(title); result }
    pub fn render_titles(titles: &[String]) -> String { titles.iter().map(|title| format!("[ ] {title}")).collect::<Vec<_>>().join("\n") }
    #[derive(Debug, Clone, PartialEq, Eq)]
    pub struct Task { pub id: u32, pub title: String, pub done: bool }
    pub fn task_create(id: u32, title: String) -> Task { Task { id, title, done: false } }
    pub struct Board { tasks: Vec<Task> }
    impl Board {
        pub fn new() -> Self { Self { tasks: Vec::new() } }
        pub fn tasks(&self) -> &[Task] { &self.tasks }
        pub fn add(&mut self, title: String) -> u32 {
            let mut id = 1;
            for task in &self.tasks { if task.id >= id { id = task.id + 1; } }
            self.tasks.push(task_create(id, title));
            id
        }

        pub fn find(&self, id: u32) -> Option<&Task> { self.tasks.iter().find(|task| task.id == id) }
        pub fn complete(&mut self, id: u32) -> bool {
            for task in &mut self.tasks {
                if task.id == id { task.done = true; return true; }
            }
            false
        }
    }
  src/main.rs: |
    fn main() { println!("Task Trail ready"); }
