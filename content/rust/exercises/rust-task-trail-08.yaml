assignment: |
  Extend Board with `pub fn find(&self, id: u32) -> Option<&Task>` and `pub fn complete(&mut self, id: u32) -> bool`. Return None/false for missing IDs. Existing tasks are marked done without changing id/title, and repeated completion returns true. Keep ownership with the board.

  ## Workflow
  Create `src/lib.rs` with the public API and `src/main.rs` with a runnable demo yourself. Extend the same project; preserve earlier APIs and stage tests.
  Read `syntaxlab docs rust projects` for syntax and independent examples.

  ```sh
  cargo run
  cargo test
  syntaxlab check
  ```
