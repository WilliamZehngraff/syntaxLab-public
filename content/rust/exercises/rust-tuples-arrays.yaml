id: rust-tuples-arrays
language: rust
module: foundations
title: 06 · Fixed collections and destructuring
order: 60
prerequisites:
- rust-booleans
concepts:
- tuple
- array
- destructuring
- indexing
difficulty: 1
assignment: |
  Create a tuple ("Ada", 3), destructure it into name and count, and create the array [2, 4, 6]. Print `Ada has 3 items; second is 4` using those values. Arrays have fixed lengths and zero-based indices; tuples may mix types.

  ## Workflow
  Create `src/main.rs` yourself. No learner implementation is supplied.
  Read `syntaxlab docs rust foundations` for syntax and independent examples.

  ```sh
  cargo run
  cargo test
  syntaxlab check
  ```
docs: rust/docs/foundations.md
hints:
- Tuple destructuring works in a let binding.
- The second element has index 1, not index 2.
files:
  Cargo.toml: |
    [package]
    name = "syntaxlab_exercise"
    version = "0.1.0"
    edition = "2021"
    rust-version = "1.70"
  tests/exercise.rs: |
    #[test]
    fn application_output() {
        let output = std::process::Command::new(env!("CARGO_BIN_EXE_syntaxlab_exercise")).output().unwrap();
        assert!(output.status.success(), "{}", String::from_utf8_lossy(&output.stderr));
        assert_eq!(String::from_utf8(output.stdout).unwrap(), "Ada has 3 items; second is 4\n");
    }
  ASSIGNMENT.md: |
    Create a tuple ("Ada", 3), destructure it into name and count, and create the array [2, 4, 6]. Print `Ada has 3 items; second is 4` using those values. Arrays have fixed lengths and zero-based indices; tuples may mix types.

    ## Workflow
    Create `src/main.rs` yourself. No learner implementation is supplied.
    Read `syntaxlab docs rust foundations` for syntax and independent examples.

    ```sh
    cargo run
    cargo test
    syntaxlab check
    ```
checks:
- type: file
  path: src/main.rs
  label: Learner src/main.rs exists
- type: command
  args:
  - $cargo
  - test
  - --offline
  label: Cargo compilation and behavior tests
  requires:
  - $cargo
  - $rustc
- type: command
  args:
  - $cargo
  - run
  - --offline
  - --quiet
  label: Application runs
  requires:
  - $cargo
  - $rustc
solution:
  src/main.rs: |
    fn main() { let (name, count) = ("Ada", 3); let values = [2, 4, 6]; println!("{name} has {count} items; second is {}", values[1]); }
project: ''
