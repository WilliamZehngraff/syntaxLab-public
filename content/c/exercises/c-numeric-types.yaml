checks:
- type: file
  path: main.c
  label: main.c exists
- type: command
  args:
  - python3
  - test_exercise.py
  requires:
  - $cc
  label: GCC warnings, linking and behavior tests
solution:
  main.c: |
    #include <stdio.h>
    int main(void) { long long population = 8000000000LL; float fraction = 0.5f; double average = (double)7 / 2; printf("%lld %.1f %.1f\n", population, fraction, average); return 0; }
project: ''
difficulty: 1
