checks:
- type: file
  path: main.c
  label: main.c exists
- type: command
  args:
  - python3
  - test_exercise.py
  requires:
  - $cc
  label: GCC warnings, linking and behavior tests
- type: construct
  path: main.c
  pattern: \bconst\s+int\b
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  main.c: |
    #include <stdio.h>
    int main(void) { const int unit_price = 7; int quantity = 3; printf("Total: %d\n", unit_price * quantity); return 0; }
project: ''
difficulty: 1
