id: c-memory-realloc
language: c
module: memory
title: 03 · Resizing without losing ownership
order: 320
prerequisites:
- c-memory-calloc
concepts:
- realloc
- ownership
- allocation-failure
assignment: |
  Write `int grow(int **owner, int old_length, int new_length)`. Inputs satisfy 0 <= old_length < new_length <= 1000;
  *owner is a heap array of old_length ints or NULL at zero. Use realloc, preserve existing elements,
  zero-fill new elements, update *owner and return 1 on success. On failure return 0 and preserve *owner.
  Include a main. Use a temporary pointer for realloc's result.

  ## Workflow
  Create `main.c` yourself. No learner source is supplied.

  ```sh
  python3 test_exercise.py
  syntaxlab check
  ```
docs: c/docs/memory.md
hints:
- Assigning realloc directly to *owner would lose the old allocation on failure.
- Only update the caller's owner after checking the temporary result.
files:
  test_exercise.c: |
    #include <assert.h>
    #include <stddef.h>
    #include <stdlib.h>
    #include <string.h>
    #include <stdio.h>
    int grow(int**, int, int);
    int main(void) {
    int *p = NULL; assert(grow(&p, 0, 2) == 1); p[0] = 9; p[1] = 8; assert(grow(&p, 2, 5) == 1); assert(p[0] == 9 && p[1] == 8 && p[2] == 0 && p[4] == 0); free(p);
    return 0;
    }
  test_exercise.py: |
    """Run with python3 test_exercise.py. GCC diagnostics are printed unchanged."""
    from pathlib import Path
    import os
    import subprocess
    import sys

    root = Path(__file__).resolve().parent
    build = root / ".syntaxlab-build" / "test_exercise"
    build.mkdir(parents=True, exist_ok=True)
    cc = os.environ.get("CC", "gcc")
    flags = ["-std=c17", "-Wall", "-Wextra", "-Wpedantic", "-Werror", "-g"]
    expected = None

    def execute(args, capture=False):
        print("+ " + " ".join(str(a) for a in args), flush=True)
        return subprocess.run(args, cwd=root, check=True, timeout=10,
                              text=True, capture_output=capture)

    try:
        sources = sorted(p for p in root.glob("*.c") if not p.name.startswith("test_"))
        if not sources:
            raise RuntimeError("Create main.c first")
        executable = build / "program"
        execute([cc, *flags, *map(str, sources), "-o", str(executable)])
        result = execute([str(executable)], capture=True)
        if expected is not None:
            assert result.stdout.strip() == expected.strip(), (
                f"Expected {expected!r}, got {result.stdout!r}")
        else:
            objects = []
            for source in sources:
                obj = build / (source.stem + ".o")
                execute([cc, *flags, "-Dmain=learner_main", "-c", str(source), "-o", str(obj)])
                objects.append(str(obj))
            harness = build / "tests"
            execute([cc, *flags, "test_exercise.c", *objects, "-o", str(harness)])
            execute([str(harness)])
        print("All behavior checks passed.")
    except (OSError, subprocess.SubprocessError, AssertionError, RuntimeError) as error:
        print(error, file=sys.stderr)
        if isinstance(error, subprocess.CalledProcessError):
            print(error.stdout or "", error.stderr or "", file=sys.stderr)
        sys.exit(1)
  ASSIGNMENT.md: |
    Write `int grow(int **owner, int old_length, int new_length)`. Inputs satisfy 0 <= old_length < new_length <= 1000;
    *owner is a heap array of old_length ints or NULL at zero. Use realloc, preserve existing elements,
    zero-fill new elements, update *owner and return 1 on success. On failure return 0 and preserve *owner.
    Include a main. Use a temporary pointer for realloc's result.

    ## Workflow
    Create `main.c` yourself. No learner source is supplied.

    ```sh
    python3 test_exercise.py
    syntaxlab check
    ```
checks:
- type: file
  path: main.c
  label: main.c exists
- type: command
  args:
  - python3
  - test_exercise.py
  requires:
  - $cc
  label: GCC warnings, linking and behavior tests
- type: construct
  path: main.c
  pattern: \brealloc\(
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  main.c: |
    #include <stdlib.h>
    int grow(int **owner, int old_length, int new_length) { int *p = realloc(*owner, (size_t)new_length * sizeof *p); if (p == NULL) return 0; for (int i = old_length; i < new_length; ++i) p[i] = 0; *owner = p; return 1; }
    int main(void) { return 0; }
