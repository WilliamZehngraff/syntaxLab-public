  label: Required lesson construct (heuristic; behavior checked above)
solution:
  main.c: |
    #include <stdlib.h>
    int *zeroes(int length) { if (length <= 0) return NULL; return calloc((size_t)length, sizeof(int)); }
    void release(int **owner) { free(*owner); *owner = NULL; }
    int main(void) { return 0; }
