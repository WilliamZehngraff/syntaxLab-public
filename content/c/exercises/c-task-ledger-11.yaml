assignment: |
  Add `int tasks_grow(Task **owner, int old_count, int new_count)` with 0 <= old_count < new_count <= 1000. Use realloc, preserve existing Tasks, zero new ones, update *owner on success and return 1; on failure return 0 without changing *owner.

  ## Workflow
  Create `main.c` yourself. Keep all previously implemented behavior.

  ```sh
  python3 test_11.py
  syntaxlab check
  ```
docs: c/docs/projects.md
hints:
- Add the new operation without breaking the older stage tests.
- Decide who owns each value, and check boundary/failure cases before the happy path.
