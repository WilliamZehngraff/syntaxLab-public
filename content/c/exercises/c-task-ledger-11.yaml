    int tasks_grow(Task**, int, int);
    int main(void) {
    Task *p = NULL; assert(tasks_grow(&p, 0, 1) == 1); p[0].id = 7; assert(tasks_grow(&p, 1, 3) == 1); assert(p[0].id == 7 && p[2].id == 0); free(p);
