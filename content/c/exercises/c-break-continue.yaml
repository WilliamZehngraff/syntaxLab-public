id: c-break-continue
language: c
module: control-flow
title: 06 · Skip and stop
order: 110
prerequisites:
- c-for
concepts:
- break
- continue
- for
assignment: |
  Write `int selected_sum(int limit)` using for, continue and break. Visit positive integers up to limit;
  skip multiples of 3 and stop before any value greater than 10. Sum the remaining values.
  A limit <= 0 gives 0. Include a main returning 0.

  ## Workflow
  Create `main.c` yourself. No learner source is supplied.

  ```sh
  python3 test_exercise.py
  syntaxlab check
  ```
docs: c/docs/control-flow.md
hints:
- break exits the nearest loop; continue advances to its next iteration.
- Check the stop rule before adding to the sum.
files:
  test_exercise.c: |
    #include <assert.h>
    #include <stddef.h>
    #include <stdlib.h>
    #include <string.h>
    #include <stdio.h>
    int selected_sum(int);
    int main(void) {
    assert(selected_sum(0) == 0); assert(selected_sum(5) == 12); assert(selected_sum(100) == 37);
    return 0;
    }
  test_exercise.py: |
    """Run with python3 test_exercise.py. GCC diagnostics are printed unchanged."""
    from pathlib import Path
    import os
    import subprocess
    import sys

    root = Path(__file__).resolve().parent
    build = root / ".syntaxlab-build" / "test_exercise"
    build.mkdir(parents=True, exist_ok=True)
    cc = os.environ.get("CC", "gcc")
    flags = ["-std=c17", "-Wall", "-Wextra", "-Wpedantic", "-Werror", "-g"]
    expected = None

    def execute(args, capture=False):
        print("+ " + " ".join(str(a) for a in args), flush=True)
        return subprocess.run(args, cwd=root, check=True, timeout=10,
                              text=True, capture_output=capture)

    try:
        sources = sorted(p for p in root.glob("*.c") if not p.name.startswith("test_"))
        if not sources:
            raise RuntimeError("Create main.c first")
        executable = build / "program"
        execute([cc, *flags, *map(str, sources), "-o", str(executable)])
        result = execute([str(executable)], capture=True)
        if expected is not None:
            assert result.stdout.strip() == expected.strip(), (
                f"Expected {expected!r}, got {result.stdout!r}")
        else:
            objects = []
            for source in sources:
                obj = build / (source.stem + ".o")
                execute([cc, *flags, "-Dmain=learner_main", "-c", str(source), "-o", str(obj)])
                objects.append(str(obj))
            harness = build / "tests"
            execute([cc, *flags, "test_exercise.c", *objects, "-o", str(harness)])
            execute([str(harness)])
        print("All behavior checks passed.")
    except (OSError, subprocess.SubprocessError, AssertionError, RuntimeError) as error:
        print(error, file=sys.stderr)
        if isinstance(error, subprocess.CalledProcessError):
            print(error.stdout or "", error.stderr or "", file=sys.stderr)
        sys.exit(1)
  ASSIGNMENT.md: |
    Write `int selected_sum(int limit)` using for, continue and break. Visit positive integers up to limit;
    skip multiples of 3 and stop before any value greater than 10. Sum the remaining values.
    A limit <= 0 gives 0. Include a main returning 0.

    ## Workflow
    Create `main.c` yourself. No learner source is supplied.

    ```sh
    python3 test_exercise.py
    syntaxlab check
    ```
checks:
- type: file
  path: main.c
  label: main.c exists
- type: command
  args:
  - python3
  - test_exercise.py
  requires:
  - $cc
  label: GCC warnings, linking and behavior tests
- type: construct
  path: main.c
  pattern: (?s)\bbreak\b.*\bcontinue\b
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  main.c: |
    int selected_sum(int limit) { int total = 0; for (int i = 1; i <= limit; ++i) { if (i > 10) break; if (i % 3 == 0) continue; total += i; } return total; }
    int main(void) { return 0; }
project: ''
difficulty: 2
