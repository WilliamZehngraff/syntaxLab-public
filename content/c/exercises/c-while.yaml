  label: main.c exists
- type: command
  args:
  - python3
  - test_exercise.py
  requires:
  - $cc
  label: GCC warnings, linking and behavior tests
- type: construct
  path: main.c
  pattern: \bwhile\s*\(
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  main.c: |
    int sum_to(int n) { int total = 0; int i = 1; while (i <= n) { total += i; ++i; } return total; }
    int main(void) { return 0; }
