checks:
- type: file
  path: main.c
  label: main.c exists
- type: command
  args:
  - python3
  - test_exercise.py
  requires:
  - $cc
  label: GCC warnings, linking and behavior tests
- type: construct
  path: main.c
  pattern: int\s+triple\s*\(int\s+\w+\)\s*;
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  main.c: |
    #include <stdio.h>
    int triple(int n);
    int main(void) { printf("%d\n", triple(4)); return 0; }
    int triple(int n) { return n * 3; }
