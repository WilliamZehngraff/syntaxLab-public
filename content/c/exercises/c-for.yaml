checks:
- type: file
  path: main.c
  label: main.c exists
- type: command
  args:
  - python3
  - test_exercise.py
  requires:
  - $cc
  label: GCC warnings, linking and behavior tests
- type: construct
  path: main.c
  pattern: \bfor\s*\(
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  main.c: |
    int factorial_loop(int n) { int product = 1; for (int i = 1; i <= n; ++i) { product *= i; } return product; }
    int main(void) { return 0; }
project: ''
difficulty: 2
