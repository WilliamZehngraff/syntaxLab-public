  - python3
  - test_exercise.py
  requires:
  - $cc
  label: GCC warnings, linking and behavior tests
solution:
  main.c: |
    #include <stdio.h>
    int main(void) { char initial = 'C'; printf("%c\tready\n", initial); return 0; }
