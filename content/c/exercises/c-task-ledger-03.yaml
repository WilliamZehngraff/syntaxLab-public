assignment: |
  Add `int can_add(int used)` returning 1 for 0 <= used < 10 and 0 otherwise. Include negative and full-capacity cases. Keep the banner and free_slots.

  ## Workflow
  Create `main.c` yourself. Keep all previously implemented behavior.

  ```sh
  python3 test_03.py
  syntaxlab check
  ```
