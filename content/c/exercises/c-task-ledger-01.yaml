assignment: |
  Create main.c printing `Task Ledger ready` and returning success. Compile and run it yourself before checking.

  ## Workflow
  Create `main.c` yourself. Keep all previously implemented behavior.

  ```sh
  python3 test_01.py
  syntaxlab check
  ```
