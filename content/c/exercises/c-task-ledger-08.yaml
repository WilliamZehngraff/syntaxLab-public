assignment: |
  Create tasks.h with guards and `typedef struct { int id; int done; char title[64]; } Task;`. Add `Task task_create(int id, const char *title)` setting id, done=0 and copying title. Inputs satisfy valid_title. Share the header between source and tests.

  ## Workflow
