checks:
- type: file
  path: main.c
  label: main.c exists
- type: command
  args:
  - python3
  - test_exercise.py
  requires:
  - $cc
  label: GCC warnings, linking and behavior tests
solution:
  main.c: |
    #include <stdio.h>
    int main(void) { printf("%d %d %d\n", 29 % 6, (4 + 3) * 2, 20 >= 18 && 1 != 0); return 0; }
project: ''
