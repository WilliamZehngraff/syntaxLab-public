checks:
- type: file
  path: main.c
  label: main.c exists
- type: command
  args:
  - python3
  - test_exercise.py
  requires:
  - $cc
  label: GCC warnings, linking and behavior tests
- type: construct
  path: main.c
  pattern: \*\w+\s*=\s*12
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  main.c: |
    #include <stdio.h>
    int main(void) { int value = 7; int *p = &value; *p = 12; printf("%d\n", value); return 0; }
project: ''
difficulty: 3
