assignment: |
  Extend main to accept `list FILE`, `add FILE TITLE`, `done FILE ID`. list prints `ID [ ] TITLE` or `ID [x] TITLE`, one task per line; add uses max existing ID + 1, stores the task and prints `Added ID`; done marks an existing task, saves, and prints `Completed`. A missing file is an empty ledger; malformed/unreadable existing files, unknown commands, invalid titles/IDs, missing IDs and bad arguments must produce a nonzero exit status and a diagnostic. Support up to 1000 tasks, allocate storage on the heap, and free it on every exit. No arguments still prints the original banner. Quotes in the shell keep a multiword TITLE together. The supplied CLI test runs the built program as a real subprocess.

  ## Workflow
  Create `main.c` yourself. Keep all previously implemented behavior.

  ```sh
  python3 test_15.py
  syntaxlab check
  ```
docs: c/docs/projects.md
hints:
- Add the new operation without breaking the older stage tests.
- Decide who owns each value, and check boundary/failure cases before the happy path.
