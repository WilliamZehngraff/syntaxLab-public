    """Run with python3 test_15.py. GCC diagnostics are printed unchanged."""
    from pathlib import Path
    import os
    import subprocess
    import sys

    root = Path(__file__).resolve().parent
    build = root / ".syntaxlab-build" / "test_15"
    build.mkdir(parents=True, exist_ok=True)
    cc = os.environ.get("CC", "gcc")
    flags = ["-std=c17", "-Wall", "-Wextra", "-Wpedantic", "-Werror", "-g"]
    expected = None

    def execute(args, capture=False):
        print("+ " + " ".join(str(a) for a in args), flush=True)
        return subprocess.run(args, cwd=root, check=True, timeout=10,
                              text=True, capture_output=capture)

    try:
        sources = sorted(p for p in root.glob("*.c") if not p.name.startswith("test_"))
        if not sources:
            raise RuntimeError("Create main.c first")
        executable = build / "program"
        execute([cc, *flags, *map(str, sources), "-o", str(executable)])
        result = execute([str(executable)], capture=True)
        if expected is not None:
            assert result.stdout.strip() == expected.strip(), (
                f"Expected {expected!r}, got {result.stdout!r}")
        else:
            objects = []
            for source in sources:
                obj = build / (source.stem + ".o")
                execute([cc, *flags, "-Dmain=learner_main", "-c", str(source), "-o", str(obj)])
                objects.append(str(obj))
            harness = build / "tests"
            execute([cc, *flags, "test_15.c", *objects, "-o", str(harness)])
            execute([str(harness)])
        print("All behavior checks passed.")
    except (OSError, subprocess.SubprocessError, AssertionError, RuntimeError) as error:
        print(error, file=sys.stderr)
        if isinstance(error, subprocess.CalledProcessError):
            print(error.stdout or "", error.stderr or "", file=sys.stderr)
        sys.exit(1)
  test_cli.py: |
    from pathlib import Path
    import subprocess
    import tempfile

    root = Path(__file__).resolve().parent
    with tempfile.TemporaryDirectory(dir=root / ".syntaxlab-build") as temporary:
        data = str(Path(temporary) / "ledger.txt")
        def call(*args, success=True):
            result = subprocess.run([str(root / "program"), *args], capture_output=True, text=True, timeout=5)
            assert (result.returncode == 0) == success, (args, result.stdout, result.stderr)
            return result.stdout.strip()
        assert call("list", data) == ""
        assert call("add", data, "Read book") == "Added 1"
        assert call("add", data, "Write tests") == "Added 2"
        assert call("list", data) == "1 [ ] Read book\n2 [ ] Write tests"
        assert call("done", data, "1") == "Completed"
        assert call("list", data) == "1 [x] Read book\n2 [ ] Write tests"
        call("done", data, "99", success=False)
        call("done", data, "oops", success=False)
        call("add", data, "", success=False)
        Path(data).write_text("malformed\n")
        call("list", data, success=False)
    print("CLI round-trip passed")
