    Write a program printing `Built with Make`. Create a Makefile with default target program, a rule
    compiling main.c with -std=c17 -Wall -Wextra -Wpedantic, and a phony clean target removing program.
    Run make, ./program, and make clean. Recipes start with a real tab, not spaces.

    ## Workflow
    Create `main.c` yourself. No learner source is supplied.

    ```sh
    python3 test_exercise.py
    syntaxlab check
    ```
checks:
- type: file
  path: main.c
  label: main.c exists
- type: command
  args:
  - python3
  - test_exercise.py
  requires:
  - $cc
  label: GCC warnings, linking and behavior tests
- type: command
  args:
  - make
  label: Makefile builds program
- type: command
  args:
  - ./program
  stdout: Built with Make
  label: Built application runs
- type: command
  args:
  - make
  - clean
  label: Clean target succeeds
solution:
  main.c: |
    #include <stdio.h>
    int main(void) { puts("Built with Make"); return 0; }
  Makefile: "CC = gcc\nCFLAGS = -std=c17 -Wall -Wextra -Wpedantic\nprogram: main.c\n\t$(CC) $(CFLAGS)\
    \ main.c -o program\n.PHONY: clean\nclean:\n\trm -f program\n"
project: ''
difficulty: 4
