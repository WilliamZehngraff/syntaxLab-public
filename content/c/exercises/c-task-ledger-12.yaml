solution:
  main.c: |
    #include <stdio.h>
    #include <stddef.h>
    #include <stdlib.h>
    #include <string.h>
    #include "tasks.h"
    int main(void) { int used = 0; if (free_slots(used) != 10) return 1; puts("Task Ledger ready"); return 0; }
  tasks.h: |
    #ifndef TASKS_H
    #define TASKS_H
    typedef struct { int id; int done; char title[64]; } Task;

    int free_slots(int);
    int can_add(int);
    int id_total(int);
    int normalized_done(int);
    int pending_count(const int[], int);
    int valid_title(const char*);

    Task task_create(int, const char*);

    int task_complete(Task*);

    Task *tasks_allocate(int);
    void tasks_release(Task**);

    int tasks_grow(Task**, int, int);

    #endif
  tasks.c: |
    #include <stdio.h>
    #include <stddef.h>
    #include <stdlib.h>
    #include <string.h>
    #include "tasks.h"
    int free_slots(int used) { const int capacity = 10; return capacity - used; }
    int can_add(int used) { if (used >= 0 && used < 10) return 1; return 0; }
    int id_total(int count) { int total = 0; for (int i = 1; i <= count; ++i) total += i; return total; }
    int normalized_done(int value) { return value != 0; }
    int pending_count(const int done[], int count) { int pending = 0; for (int i = 0; i < count; ++i) if (!normalized_done(done[i])) ++pending; return pending; }
    int valid_title(const char *title) { size_t n = strlen(title); return n > 0 && n < 64 && strpbrk(title, "\n\t\r") == NULL; }
    Task task_create(int id, const char *title) { Task t = {0}; t.id = id; snprintf(t.title, sizeof t.title, "%s", title); return t; }
    int task_complete(Task *task) { if (!task) return 0; task->done = 1; return 1; }
    Task *tasks_allocate(int count) { if (count <= 0) return NULL; return calloc((size_t)count, sizeof(Task)); }
    void tasks_release(Task **owner) { free(*owner); *owner = NULL; }
    int tasks_grow(Task **owner, int old_count, int new_count) { Task *p = realloc(*owner, (size_t)new_count * sizeof *p); if (!p) return 0; memset(p + old_count, 0, (size_t)(new_count - old_count) * sizeof *p); *owner = p; return 1; }
