assignment: |
  Move all helper definitions into tasks.c. Put their prototypes and the Task type in guarded tasks.h. main.c should only contain the entry point and include tasks.h. Compile and link both .c files; keep every earlier test passing.

  ## Workflow
  Create `main.c` yourself. Keep all previously implemented behavior.

  ```sh
  python3 test_12.py
  syntaxlab check
  ```
