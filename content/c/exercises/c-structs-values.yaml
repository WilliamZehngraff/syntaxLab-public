id: c-structs-values
language: c
module: structs
title: 01 · Named records and typedef
order: 260
prerequisites:
- c-pointers-double
concepts:
- struct
- typedef
- initialization
- member-access
- headers
assignment: |
  Create todo.h with include guards and `typedef struct { int id; int done; } Todo;`.
  Include it from main.c. Implement `Todo make_todo(int id)` returning id and done = 0,
  and `int is_done(Todo todo)` returning 1 iff done is nonzero. Include a main.

  ## Workflow
  Create `main.c` yourself. No learner source is supplied.

  ```sh
  python3 test_exercise.py
  syntaxlab check
  ```
docs: c/docs/structs.md
hints:
- A struct groups fields; the dot operator accesses fields on a value.
- The test includes your header, so put the shared type there.
files:
  test_exercise.c: |
    #include <assert.h>
    #include <stddef.h>
    #include <stdlib.h>
    #include <string.h>
    #include <stdio.h>
    #include "todo.h"
    Todo make_todo(int);
    int is_done(Todo);
    int main(void) {
    Todo t = make_todo(7); assert(t.id == 7 && t.done == 0); assert(is_done(t) == 0); t.done = 4; assert(is_done(t) == 1);
    return 0;
    }
  test_exercise.py: |
    """Run with python3 test_exercise.py. GCC diagnostics are printed unchanged."""
    from pathlib import Path
    import os
    import subprocess
    import sys

    root = Path(__file__).resolve().parent
    build = root / ".syntaxlab-build" / "test_exercise"
    build.mkdir(parents=True, exist_ok=True)
    cc = os.environ.get("CC", "gcc")
    flags = ["-std=c17", "-Wall", "-Wextra", "-Wpedantic", "-Werror", "-g"]
    expected = None

    def execute(args, capture=False):
        print("+ " + " ".join(str(a) for a in args), flush=True)
        return subprocess.run(args, cwd=root, check=True, timeout=10,
                              text=True, capture_output=capture)

    try:
        sources = sorted(p for p in root.glob("*.c") if not p.name.startswith("test_"))
        if not sources:
            raise RuntimeError("Create main.c first")
        executable = build / "program"
        execute([cc, *flags, *map(str, sources), "-o", str(executable)])
        result = execute([str(executable)], capture=True)
        if expected is not None:
            assert result.stdout.strip() == expected.strip(), (
                f"Expected {expected!r}, got {result.stdout!r}")
        else:
            objects = []
            for source in sources:
                obj = build / (source.stem + ".o")
                execute([cc, *flags, "-Dmain=learner_main", "-c", str(source), "-o", str(obj)])
                objects.append(str(obj))
            harness = build / "tests"
            execute([cc, *flags, "test_exercise.c", *objects, "-o", str(harness)])
            execute([str(harness)])
        print("All behavior checks passed.")
    except (OSError, subprocess.SubprocessError, AssertionError, RuntimeError) as error:
        print(error, file=sys.stderr)
        if isinstance(error, subprocess.CalledProcessError):
            print(error.stdout or "", error.stderr or "", file=sys.stderr)
        sys.exit(1)
  ASSIGNMENT.md: |
    Create todo.h with include guards and `typedef struct { int id; int done; } Todo;`.
    Include it from main.c. Implement `Todo make_todo(int id)` returning id and done = 0,
    and `int is_done(Todo todo)` returning 1 iff done is nonzero. Include a main.

    ## Workflow
    Create `main.c` yourself. No learner source is supplied.

    ```sh
    python3 test_exercise.py
    syntaxlab check
    ```
checks:
- type: file
  path: main.c
  label: main.c exists
- type: command
  args:
  - python3
  - test_exercise.py
  requires:
  - $cc
  label: GCC warnings, linking and behavior tests
solution:
  main.c: |
    #include "todo.h"
    Todo make_todo(int id) { Todo t = {id, 0}; return t; }
    int is_done(Todo todo) { return todo.done != 0; }
    int main(void) { return 0; }
  todo.h: |
    #ifndef TODO_H
    #define TODO_H
    typedef struct { int id; int done; } Todo;
    #endif
project: ''
difficulty: 3
