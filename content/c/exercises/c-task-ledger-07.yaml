assignment: |
  Add `int valid_title(const char *title)` returning 1 iff length is 1..63 and there are no newline, tab or carriage-return characters. Spaces are allowed. The input is a valid non-null string.

  ## Workflow
  Create `main.c` yourself. Keep all previously implemented behavior.

  ```sh
  python3 test_07.py
  syntaxlab check
  ```
