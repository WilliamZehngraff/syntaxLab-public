id: scala-functions-defaults
language: scala
module: functions
title: 05 · Default and named arguments
order: 120
prerequisites:
- scala-functions-local
concepts:
- default-arguments
- named-arguments
- interpolation
assignment: |
  Write `def label(name: String, count: Int = 1): String` returning `name: count`,
  e.g. label("pens", 4) is `pens: 4`. Add a demo calling it with named arguments in reversed order.

  ## Workflow
  Create `Main.scala` yourself. No learner source is supplied.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
docs: scala/docs/functions.md
hints:
- Give the default after the parameter's type.
- Named arguments use parameterName = value at the call site.
files:
  project.scala: |
    //> using scala "3.3.7"
    //> using test.dep "org.scalameta::munit:1.0.4"
  Exercise.test.scala: |
    class ExerciseTests extends munit.FunSuite:
      test("default and named calls") {
               assertEquals(label("books"), "books: 1")
               assertEquals(label(count = 0, name = "cards"), "cards: 0")
             }
  ASSIGNMENT.md: |
    Write `def label(name: String, count: Int = 1): String` returning `name: count`,
    e.g. label("pens", 4) is `pens: 4`. Add a demo calling it with named arguments in reversed order.

    ## Workflow
    Create `Main.scala` yourself. No learner source is supplied.

    ```sh
    scala-cli run .
    scala-cli test .
    syntaxlab check
    ```
checks:
- type: file
  path: Main.scala
  label: Main.scala exists
- type: command
  args:
  - $scala
  - test
  - .
  - --server=false
  timeout: 240
  label: Scala compilation and MUnit behavior tests
- type: command
  args:
  - $scala
  - run
  - .
  - --server=false
  timeout: 240
  label: Application entry point runs
solution:
  Main.scala: |
    def label(name: String, count: Int = 1): String = s"$name: $count"
    @main def demo(): Unit = println(label(count = 4, name = "pens"))
project: ''
difficulty: 2
