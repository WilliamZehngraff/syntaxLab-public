  label: Required lesson construct (heuristic; behavior checked above)
solution:
  Main.scala: |
    class Ticket private (val name: String)
    object Ticket:
      def create(raw: String): Ticket = new Ticket(raw.trim)
    @main def demo(): Unit = println(Ticket.create(" Ada " ).name)
