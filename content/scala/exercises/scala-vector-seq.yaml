id: scala-vector-seq
language: scala
module: collections
title: 03 · Indexed sequences
order: 210
prerequisites:
- scala-lists
concepts:
- Vector
- Seq
- indexing
- immutability
assignment: |
  Write `def replaceAt(xs: Vector[Int], index: Int, value: Int): Vector[Int]` returning a new Vector with
  one element replaced. index is always valid. Do not change the input. Add a main.

  ## Workflow
  Create `Main.scala` yourself. No learner source is supplied.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
docs: scala/docs/collections.md
hints:
- Immutable update returns a new collection.
- updated(index, value) differs from assignment to an array element.
files:
  project.scala: |
    //> using scala "3.3.7"
    //> using test.dep "org.scalameta::munit:1.0.4"
  Exercise.test.scala: |
    class ExerciseTests extends munit.FunSuite:
      test("indexed update") { val xs = Vector(1, 2, 3); assertEquals(replaceAt(xs, 1, 9), Vector(1, 9, 3)); assertEquals(xs, Vector(1, 2, 3)); assertEquals(replaceAt(Vector(0), 0, 7), Vector(7)) }
  ASSIGNMENT.md: |
    Write `def replaceAt(xs: Vector[Int], index: Int, value: Int): Vector[Int]` returning a new Vector with
    one element replaced. index is always valid. Do not change the input. Add a main.

    ## Workflow
    Create `Main.scala` yourself. No learner source is supplied.

    ```sh
    scala-cli run .
    scala-cli test .
    syntaxlab check
    ```
checks:
- type: file
  path: Main.scala
  label: Main.scala exists
- type: command
  args:
  - $scala
  - test
  - .
  - --server=false
  timeout: 240
  label: Scala compilation and MUnit behavior tests
- type: command
  args:
  - $scala
  - run
  - .
  - --server=false
  timeout: 240
  label: Application entry point runs
solution:
  Main.scala: |
    def replaceAt(xs: Vector[Int], index: Int, value: Int): Vector[Int] = xs.updated(index, value)
    @main def demo(): Unit = println(replaceAt(Vector(1, 2), 0, 9))
project: ''
difficulty: 3
