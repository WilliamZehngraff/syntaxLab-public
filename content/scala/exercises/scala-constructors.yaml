    ```
checks:
- type: file
  path: Main.scala
  label: Main.scala exists
- type: command
  args:
  - $scala
  - test
  - .
  - --server=false
  timeout: 240
  label: Scala compilation and MUnit behavior tests
- type: command
  args:
  - $scala
  - run
  - .
  - --server=false
  timeout: 240
  label: Application entry point runs
- type: construct
  path: Main.scala
  pattern: def\s+this\(
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  Main.scala: |
    class Rectangle(val width: Int, val height: Int):
      def this(side: Int) = this(side, side)
      def area: Int = width * height
    @main def demo(): Unit = println(new Rectangle(4).area)
project: ''
difficulty: 4
