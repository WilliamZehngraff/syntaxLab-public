id: scala-constructors
language: scala
module: oop
title: 02 · Auxiliary constructors
order: 320
prerequisites:
- scala-classes
concepts:
- auxiliary-constructors
- constructor-parameters
- methods
assignment: |
  Define `class Rectangle(val width: Int, val height: Int)` with `def area: Int` and an auxiliary
  constructor taking one side to make a square. Inputs are nonnegative. Add a main using both constructors.

  ## Workflow
  Create `Main.scala` yourself. No learner source is supplied.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
docs: scala/docs/oop.md
hints:
- An auxiliary constructor is named this.
- Its first action delegates to the primary constructor.
files:
  project.scala: |
    //> using scala "3.3.7"
    //> using test.dep "org.scalameta::munit:1.0.4"
  Exercise.test.scala: |
    class ExerciseTests extends munit.FunSuite:
      test("constructor delegation") { assertEquals(new Rectangle(3, 5).area, 15); val square = new Rectangle(4); assertEquals(square.width, 4); assertEquals(square.height, 4); assertEquals(square.area, 16) }
  ASSIGNMENT.md: |
    Define `class Rectangle(val width: Int, val height: Int)` with `def area: Int` and an auxiliary
    constructor taking one side to make a square. Inputs are nonnegative. Add a main using both constructors.

    ## Workflow
    Create `Main.scala` yourself. No learner source is supplied.

    ```sh
