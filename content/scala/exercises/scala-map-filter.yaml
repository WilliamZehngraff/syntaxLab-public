id: scala-map-filter
language: scala
module: collections
title: 05 · Transform and select
order: 230
prerequisites:
- scala-sets-maps
concepts:
- map
- filter
- lambdas
- pure-functions
assignment: |
  Write `def positiveSquares(xs: List[Int]): List[Int]` which keeps strictly positive values and squares
  them, preserving order and duplicates. Use filter and map with lambdas. Add a main.

  ## Workflow
  Create `Main.scala` yourself. No learner source is supplied.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
docs: scala/docs/collections.md
hints:
- Filtering after squaring loses the sign information.
- A lambda has parameter => expression syntax.
files:
  project.scala: |
    //> using scala "3.3.7"
    //> using test.dep "org.scalameta::munit:1.0.4"
  Exercise.test.scala: |
    class ExerciseTests extends munit.FunSuite:
      test("selection before transformation") { assertEquals(positiveSquares(List(-2, 3, 0, 2, 3)), List(9, 4, 9)); assertEquals(positiveSquares(Nil), Nil) }
  ASSIGNMENT.md: |
    Write `def positiveSquares(xs: List[Int]): List[Int]` which keeps strictly positive values and squares
    them, preserving order and duplicates. Use filter and map with lambdas. Add a main.

    ## Workflow
    Create `Main.scala` yourself. No learner source is supplied.

    ```sh
    scala-cli run .
    scala-cli test .
    syntaxlab check
    ```
checks:
- type: file
  path: Main.scala
  label: Main.scala exists
- type: command
  args:
  - $scala
  - test
  - .
  - --server=false
  timeout: 240
  label: Scala compilation and MUnit behavior tests
- type: command
  args:
  - $scala
  - run
  - .
  - --server=false
  timeout: 240
  label: Application entry point runs
- type: construct
  path: Main.scala
  pattern: \.filter\(
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  Main.scala: |
    def positiveSquares(xs: List[Int]): List[Int] = xs.filter(x => x > 0).map(x => x * x)
    @main def demo(): Unit = println(positiveSquares(List(-2, 3, 0, 2)))
project: ''
difficulty: 3
