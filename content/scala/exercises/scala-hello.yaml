    ```sh
    scala-cli run .
    scala-cli test .
    syntaxlab check
    ```
checks:
- type: file
  path: Main.scala
  label: Main.scala exists
- type: command
  args:
  - $scala
  - test
  - .
  - --server=false
  timeout: 240
  label: Scala compilation and MUnit behavior tests
- type: command
  args:
  - $scala
  - run
  - .
  - --server=false
  timeout: 240
  label: Application entry point runs
- type: construct
  path: Main.scala
  pattern: '@main'
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  Main.scala: |
    @main def hello(): Unit =
      // Print a line and its newline.
      println("Hello, SyntaxLab!")
project: ''
difficulty: 1
