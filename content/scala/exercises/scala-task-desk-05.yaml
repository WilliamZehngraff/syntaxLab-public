assignment: |
  Add `def addTitle(titles: Vector[String], title: String): Vector[String]` appending title and `def listTitles(titles: Vector[String]): String` joining unfinished taskLabel values with newline. Preserve order; empty input renders an empty string.

  ## Workflow
  Create `Main.scala` yourself. Keep all previously implemented behavior.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
