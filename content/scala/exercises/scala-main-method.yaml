    syntaxlab check
    ```
checks:
- type: file
  path: Main.scala
  label: Main.scala exists
- type: command
  args:
  - $scala
  - test
  - .
  - --server=false
  timeout: 240
  label: Scala compilation and MUnit behavior tests
- type: command
  args:
  - $scala
  - run
  - .
  - --server=false
  timeout: 240
  label: Application entry point runs
- type: construct
  path: Main.scala
  pattern: object\s+Main
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  Main.scala: |
    object Main:
      def main(args: Array[String]): Unit =
        println("Ready to learn")
project: ''
difficulty: 1
