id: scala-for-ranges
language: scala
module: control-flow
title: 04 · Ranges and for loops
order: 170
prerequisites:
- scala-while
concepts:
- for
- ranges
- if
assignment: |
  Write `def evenTotal(n: Int): Int` using a for loop over a range. Sum all even numbers from 0 through n,
  where n is nonnegative and at most 1000. Include n if even. Add a main.

  ## Workflow
  Create `Main.scala` yourself. No learner source is supplied.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
docs: scala/docs/control-flow.md
hints:
- to includes its endpoint; until excludes it.
- Reuse isEven's idea inside the loop.
files:
  project.scala: |
    //> using scala "3.3.7"
    //> using test.dep "org.scalameta::munit:1.0.4"
  Exercise.test.scala: |
    class ExerciseTests extends munit.FunSuite:
      test("inclusive even sum") { assertEquals(evenTotal(0), 0); assertEquals(evenTotal(5), 6); assertEquals(evenTotal(6), 12) }
