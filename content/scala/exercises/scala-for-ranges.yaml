checks:
- type: file
  path: Main.scala
  label: Main.scala exists
- type: command
  args:
  - $scala
  - test
  - .
  - --server=false
  timeout: 240
  label: Scala compilation and MUnit behavior tests
- type: command
  args:
  - $scala
  - run
  - .
  - --server=false
  timeout: 240
  label: Application entry point runs
- type: construct
  path: Main.scala
  pattern: \bfor\b
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  Main.scala: |
    def evenTotal(n: Int): Int =
      var total = 0
      for i <- 0 to n do
        if i % 2 == 0 then total += i
      total
    @main def demo(): Unit = println(evenTotal(8))
