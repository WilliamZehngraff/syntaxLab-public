- type: command
  args:
  - $scala
  - test
  - .
  - --server=false
  timeout: 240
  label: Scala compilation and MUnit behavior tests
- type: command
  args:
  - $scala
  - run
  - .
  - --server=false
  timeout: 240
  label: Application entry point runs
- type: construct
  path: Main.scala
  pattern: '@tailrec'
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  Main.scala: |
    import scala.annotation.tailrec
    def countItems(xs: List[Int]): Int =
      @tailrec
      def loop(rest: List[Int], acc: Int): Int = rest match
        case Nil => acc
        case _ :: tail => loop(tail, acc + 1)
      loop(xs, 0)
    @main def demo(): Unit = println(countItems(List(1, 2)))
