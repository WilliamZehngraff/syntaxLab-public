assignment: |
  Write `def countItems(xs: List[Int]): Int` with a local recursive helper annotated `@tailrec`.
  Count without size, length or loops. It must handle 100000 items without stack overflow.
  Add a main. Import scala.annotation.tailrec.

  ## Workflow
  Create `Main.scala` yourself. No learner source is supplied.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
docs: scala/docs/recursion.md
hints:
- Carry the answer-so-far as a helper parameter.
- The recursive call must be the last operation; do not add after it returns.
