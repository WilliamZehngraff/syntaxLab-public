checks:
- type: file
  path: Main.scala
  label: Main.scala exists
- type: command
  args:
  - $scala
  - test
  - .
  - --server=false
  timeout: 240
  label: Scala compilation and MUnit behavior tests
- type: command
  args:
  - $scala
  - run
  - .
  - --server=false
  timeout: 240
  label: Application entry point runs
- type: construct
  path: Main.scala
  pattern: \bwhile\b
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  Main.scala: |
    def sumTo(n: Int): Int =
      var i = 1
      var total = 0
      while i <= n do
        total += i
        i += 1
      total
    @main def demo(): Unit = println(sumTo(5))
