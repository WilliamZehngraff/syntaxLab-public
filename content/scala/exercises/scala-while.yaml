id: scala-while
language: scala
module: control-flow
title: 03 · While and a changing state
order: 160
prerequisites:
- scala-else-if
concepts:
- while
- var
- accumulation
assignment: |
  Write `def sumTo(n: Int): Int` with a while loop to sum 1 through n. Inputs are 0..1000; sumTo(0) = 0.
  Use local variables only. Calling it twice must give the same result. Add a main.

  ## Workflow
  Create `Main.scala` yourself. No learner source is supplied.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
docs: scala/docs/control-flow.md
hints:
- Track the next number and accumulated sum separately.
- Every loop iteration must make progress toward termination.
files:
  project.scala: |
    //> using scala "3.3.7"
    //> using test.dep "org.scalameta::munit:1.0.4"
  Exercise.test.scala: |
