assignment: |
  Add `def titleFrom(args: Array[String]): String`: join command-line words with spaces, or return `Untitled` if no words. Use args.isEmpty and args.mkString(" "), explained here as array queries. Keep no-argument startup unchanged; main with arguments prints taskLabel(titleFrom(args)).

  ## Workflow
  Create `Main.scala` yourself. Keep all previously implemented behavior.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
