id: scala-match-guards
language: scala
module: pattern-matching
title: 02 · Tuples, bindings and guards
order: 250
prerequisites:
- scala-match-basic
concepts:
- tuple-patterns
- guards
- variable-patterns
assignment: |
  Write `def position(point: (Int, Int)): String` using match. (0,0) → origin; x = y → diagonal;
  all other coordinates → other. The origin takes precedence. Add a main.

  ## Workflow
  Create `Main.scala` yourself. No learner source is supplied.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
docs: scala/docs/pattern-matching.md
hints:
- Earlier cases win.
- Bind both coordinates in a pattern, then compare them in a guard.
files:
  project.scala: |
    //> using scala "3.3.7"
    //> using test.dep "org.scalameta::munit:1.0.4"
  Exercise.test.scala: |
    class ExerciseTests extends munit.FunSuite:
      test("ordered tuple patterns") { assertEquals(position((0, 0)), "origin"); assertEquals(position((-2, -2)), "diagonal"); assertEquals(position((2, 3)), "other") }
  ASSIGNMENT.md: |
    Write `def position(point: (Int, Int)): String` using match. (0,0) → origin; x = y → diagonal;
    all other coordinates → other. The origin takes precedence. Add a main.

    ## Workflow
    Create `Main.scala` yourself. No learner source is supplied.

    ```sh
    scala-cli run .
    scala-cli test .
    syntaxlab check
    ```
checks:
- type: file
  path: Main.scala
  label: Main.scala exists
- type: command
  args:
  - $scala
  - test
  - .
  - --server=false
  timeout: 240
  label: Scala compilation and MUnit behavior tests
- type: command
  args:
  - $scala
  - run
  - .
  - --server=false
  timeout: 240
  label: Application entry point runs
- type: construct
  path: Main.scala
  pattern: case\s+\(\w+,\s*\w+\)\s+if
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  Main.scala: |
    def position(point: (Int, Int)): String = point match
      case (0, 0) => "origin"
      case (x, y) if x == y => "diagonal"
      case _ => "other"
    @main def demo(): Unit = println(position((2, 2)))
project: ''
difficulty: 3
