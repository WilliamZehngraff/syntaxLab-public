id: scala-match-list
language: scala
module: pattern-matching
title: 03 · List shapes
order: 260
prerequisites:
- scala-match-guards
concepts:
- List-patterns
- cons
- Nil
assignment: |
  Write `def shape(xs: List[Int]): String` using List patterns: empty → empty; one item → single;
  two or more → many. Never index a List to solve this. Add a main.

  ## Workflow
  Create `Main.scala` yourself. No learner source is supplied.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
docs: scala/docs/pattern-matching.md
hints:
- Nil matches an empty List.
- 'head :: tail separates one item from the remaining List.'
files:
  project.scala: |
    //> using scala "3.3.7"
    //> using test.dep "org.scalameta::munit:1.0.4"
  Exercise.test.scala: |
    class ExerciseTests extends munit.FunSuite:
      test("all shapes") { assertEquals(shape(Nil), "empty"); assertEquals(shape(List(8)), "single"); assertEquals(shape(List(1, 2)), "many"); assertEquals(shape(List(1, 2, 3)), "many") }
  ASSIGNMENT.md: |
    Write `def shape(xs: List[Int]): String` using List patterns: empty → empty; one item → single;
    two or more → many. Never index a List to solve this. Add a main.

    ## Workflow
    Create `Main.scala` yourself. No learner source is supplied.

    ```sh
    scala-cli run .
    scala-cli test .
    syntaxlab check
    ```
checks:
- type: file
  path: Main.scala
  label: Main.scala exists
- type: command
  args:
  - $scala
  - test
  - .
  - --server=false
  timeout: 240
  label: Scala compilation and MUnit behavior tests
- type: command
  args:
  - $scala
  - run
  - .
  - --server=false
  timeout: 240
  label: Application entry point runs
- type: construct
  path: Main.scala
  pattern: 'case\s+.*::'
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  Main.scala: |
    def shape(xs: List[Int]): String = xs match
      case Nil => "empty"
      case _ :: Nil => "single"
      case _ :: _ => "many"
    @main def demo(): Unit = println(shape(List(1, 2)))
project: ''
difficulty: 3
