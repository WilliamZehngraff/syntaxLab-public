      test("parsing") { assertEquals(parseCommand("add"), Some(Command.Add)); assertEquals(parseCommand("list"), Some(Command.ListAll)); assertEquals(parseCommand("quit"), Some(Command.Quit)); assertEquals(parseCommand("?"), None) }
