- type: command
  args:
  - $scala
  - test
  - .
  - --server=false
  timeout: 240
  label: Scala compilation and MUnit behavior tests
- type: command
  args:
  - $scala
  - run
  - .
  - --server=false
  timeout: 240
  label: Application entry point runs
- type: construct
  path: Main.scala
  pattern: enum\s+Command
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  Main.scala: |
    enum Command:
      case Add, ListAll, Quit
    def parseCommand(text: String): Option[Command] = text match
      case "add" => Some(Command.Add)
      case "list" => Some(Command.ListAll)
      case "quit" => Some(Command.Quit)
      case _ => None
    @main def demo(): Unit = println(parseCommand("add"))
