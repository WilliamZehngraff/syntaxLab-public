assignment: |
  Define enum `Command` with cases Add, ListAll, Quit. Write `def parseCommand(text: String): Option[Command]`
  mapping add/list/quit respectively and returning None otherwise. Use match. Add a main.

  ## Workflow
  Create `Main.scala` yourself. No learner source is supplied.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
docs: scala/docs/data-modeling.md
hints:
- An enum names a closed set of alternatives.
- Keep parsing separate from effects such as reading user input.
