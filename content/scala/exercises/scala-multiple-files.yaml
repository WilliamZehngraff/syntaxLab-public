id: scala-multiple-files
language: scala
module: organization
title: 01 · Packages, imports and tests
order: 380
prerequisites:
- scala-enums
concepts:
- packages
- imports
- multiple-files
- directives
- tests
assignment: |
  Create Main.scala with a runnable @main demo, plus `lab/Formatting.scala` defining package lab and
  object Formatting with `def heading(text: String): String`, returning trimmed uppercase text.
  Import it into Main.scala. Keep project.scala and run both run and test commands.

  ## Workflow
  Create `Main.scala` yourself. No learner source is supplied.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
docs: scala/docs/organization.md
hints:
- A package declaration goes at the top of its source file.
- scala-cli recursively compiles sources beneath the workspace root.
files:
  project.scala: |
    //> using scala "3.3.7"
    //> using test.dep "org.scalameta::munit:1.0.4"
  Exercise.test.scala: |
    class ExerciseTests extends munit.FunSuite:
      test("cross-file import") { assertEquals(lab.Formatting.heading(" notes "), "NOTES"); assertEquals(lab.Formatting.heading(""), "") }
  ASSIGNMENT.md: |
    Create Main.scala with a runnable @main demo, plus `lab/Formatting.scala` defining package lab and
    object Formatting with `def heading(text: String): String`, returning trimmed uppercase text.
    Import it into Main.scala. Keep project.scala and run both run and test commands.

    ## Workflow
    Create `Main.scala` yourself. No learner source is supplied.

    ```sh
    scala-cli run .
    scala-cli test .
    syntaxlab check
    ```
checks:
- type: file
  path: Main.scala
  label: Main.scala exists
- type: command
  args:
  - $scala
  - test
  - .
  - --server=false
  timeout: 240
  label: Scala compilation and MUnit behavior tests
- type: command
  args:
  - $scala
  - run
  - .
  - --server=false
  timeout: 240
  label: Application entry point runs
solution:
  Main.scala: |
    import lab.Formatting
    @main def demo(): Unit = println(Formatting.heading(" report "))
  lab/Formatting.scala: |
    package lab
    object Formatting:
      def heading(text: String): String = text.trim.toUpperCase
project: ''
difficulty: 5
