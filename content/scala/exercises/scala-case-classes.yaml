id: scala-case-classes
language: scala
module: data-modeling
title: 01 · Immutable records
order: 350
prerequisites:
- scala-traits
concepts:
- case-classes
- copy
- immutability
- constructor-patterns
assignment: |
  Define `case class Book(title: String, pages: Int)` and `def retitle(book: Book, title: String): Book`
  using copy. Keep pages unchanged and do not mutate the original. Add a main.

  ## Workflow
  Create `Main.scala` yourself. No learner source is supplied.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
docs: scala/docs/data-modeling.md
hints:
- Case classes provide value equality and copy.
- Named arguments let copy change only one field.
files:
  project.scala: |
    //> using scala "3.3.7"
    //> using test.dep "org.scalameta::munit:1.0.4"
  Exercise.test.scala: |
    class ExerciseTests extends munit.FunSuite:
      test("value equality and copy") { val b = Book("Old", 20); assertEquals(retitle(b, "New"), Book("New", 20)); assertEquals(b, Book("Old", 20)) }
  ASSIGNMENT.md: |
    Define `case class Book(title: String, pages: Int)` and `def retitle(book: Book, title: String): Book`
    using copy. Keep pages unchanged and do not mutate the original. Add a main.

    ## Workflow
    Create `Main.scala` yourself. No learner source is supplied.

    ```sh
    scala-cli run .
    scala-cli test .
    syntaxlab check
    ```
checks:
- type: file
  path: Main.scala
  label: Main.scala exists
- type: command
  args:
  - $scala
  - test
  - .
  - --server=false
  timeout: 240
  label: Scala compilation and MUnit behavior tests
- type: command
  args:
  - $scala
  - run
  - .
  - --server=false
  timeout: 240
  label: Application entry point runs
- type: construct
  path: Main.scala
  pattern: case class Book
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  Main.scala: |
    case class Book(title: String, pages: Int)
    def retitle(book: Book, title: String): Book = book.copy(title = title)
    @main def demo(): Unit = println(retitle(Book("Old", 20), "New"))
project: ''
difficulty: 4
