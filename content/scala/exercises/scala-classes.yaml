checks:
- type: file
  path: Main.scala
  label: Main.scala exists
- type: command
  args:
  - $scala
  - test
  - .
  - --server=false
  timeout: 240
  label: Scala compilation and MUnit behavior tests
- type: command
  args:
  - $scala
  - run
  - .
  - --server=false
  timeout: 240
  label: Application entry point runs
solution:
  Main.scala: |
    class Counter(val start: Int):
      private var count = start
      def value: Int = count
      def increment(): Unit = count += 1
    @main def demo(): Unit =
      val c = new Counter(2)
      c.increment()
      println(c.value)
