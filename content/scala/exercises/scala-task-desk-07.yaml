solution:
  Main.scala: |
    def banner: String = "Task Desk ready"
    val owner: String = "Learner"
    val capacity: Int = 10
    def welcome: String = s"$owner has room for $capacity tasks"
    def taskLabel(title: String, done: Boolean = false): String =
      val mark = if done then "x" else " "
      s"[$mark] $title"
    def titleFrom(args: Array[String]): String = if args.isEmpty then "Untitled" else args.mkString(" ")
    def addTitle(titles: Vector[String], title: String): Vector[String] = titles :+ title
    def listTitles(titles: Vector[String]): String = titles.map(t => taskLabel(t)).mkString("\n")
    def commandKind(word: String): String = word match
      case "add" => "add"
      case "list" => "list"
      case "done" => "done"
      case "quit" => "quit"
      case _ => "unknown"
    case class Task(id: Int, title: String, done: Boolean = false)
    def completeTask(task: Task): Task = task.copy(done = true)
    object Main:
      def main(args: Array[String]): Unit =
        if args.isEmpty then println(banner) else println(taskLabel(titleFrom(args)))
