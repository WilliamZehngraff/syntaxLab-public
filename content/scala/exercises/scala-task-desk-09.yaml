assignment: |
  Extend Board with `def find(id: Int): Option[Task]` and `def complete(id: Int): Boolean`. Completion marks a matching task done and returns true, including repeated completion. Missing IDs return false and leave tasks unchanged.

  ## Workflow
  Create `Main.scala` yourself. Keep all previously implemented behavior.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
