assignment: |
  Add `def taskLabel(title: String, done: Boolean = false): String` yielding `[ ] title` or `[x] title`. Use an if expression (review control flow if needed). Do not change title whitespace.

  ## Workflow
  Create `Main.scala` yourself. Keep all previously implemented behavior.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
