assignment: |
  Add top-level `val owner: String = "Learner"`, `val capacity: Int = 10`, and `def welcome: String` returning `Learner has room for 10 tasks` using interpolation. Keep the startup banner.

  ## Workflow
  Create `Main.scala` yourself. Keep all previously implemented behavior.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
docs: scala/docs/projects.md
hints:
- Keep earlier tests green while introducing the new behavior.
- Review the foundations reference, then separate calculation from input/output.
