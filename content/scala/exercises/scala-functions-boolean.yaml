checks:
- type: file
  path: Main.scala
  label: Main.scala exists
- type: command
  args:
  - $scala
  - test
  - .
  - --server=false
  timeout: 240
  label: Scala compilation and MUnit behavior tests
- type: command
  args:
  - $scala
  - run
  - .
  - --server=false
  timeout: 240
  label: Application entry point runs
solution:
  Main.scala: |
    def isEven(n: Int): Boolean = n % 2 == 0
    def inRange(n: Int, low: Int, high: Int): Boolean = n >= low && n <= high
    @main def demo(): Unit = println(isEven(4))
