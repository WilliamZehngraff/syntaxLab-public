id: scala-functions-boolean
language: scala
module: functions
title: 03 · Boolean results
order: 100
prerequisites:
- scala-functions-multiple
concepts:
- Boolean
- functions
- operators
assignment: |
  Write `def isEven(n: Int): Boolean` and `def inRange(n: Int, low: Int, high: Int): Boolean`.
  Range endpoints are inclusive; low <= high. Support negative numbers. Add a runnable demo.

  ## Workflow
  Create `Main.scala` yourself. No learner source is supplied.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
docs: scala/docs/functions.md
hints:
- A comparison already produces Boolean.
- Test both endpoints, not just a value in the middle.
files:
  project.scala: |
    //> using scala "3.3.7"
    //> using test.dep "org.scalameta::munit:1.0.4"
  Exercise.test.scala: |
    class ExerciseTests extends munit.FunSuite:
      test("predicates include boundaries") {
               assert(isEven(-4)); assert(!isEven(3)); assert(isEven(0))
               assert(inRange(2, 2, 7)); assert(inRange(7, 2, 7)); assert(!inRange(8, 2, 7))
             }
  ASSIGNMENT.md: |
