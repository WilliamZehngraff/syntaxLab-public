assignment: |
  Define `class Board(val name: String)` with an auxiliary no-argument constructor using name `Inbox`. Give it `def tasks: Vector[Task]` initially empty and `def add(title: String): Task`, assigning IDs 1,2,... and appending. Keep storage private. Separate boards must be independent.

  ## Workflow
