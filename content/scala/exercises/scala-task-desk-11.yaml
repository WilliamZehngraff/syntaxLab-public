  STAGE-11.md: |
    Add `def execute(board: Board, line: String): String` supporting: `add TITLE` → `Added ID` (trim TITLE; reject empty with `Invalid command`); `list` → lines `ID [ ] TITLE` or `ID [x] TITLE`; `done ID` → `Completed` or `Not found`; malformed/unknown input → `Invalid command`; `quit` → `Bye`. IDs must parse safely. Add --interactive to main: read lines, execute and print until quit or EOF. Preserve no-argument banner. Add Learner.test.scala with tests you wrote for malformed input and independent boards.

    ## Workflow
    Create `Main.scala` yourself. Keep all previously implemented behavior.

    ```sh
    scala-cli run .
    scala-cli test .
    syntaxlab check
    ```

    The interactive loop may use `> ` as its prompt, or no prompt. Print only command results.
  Interactive.test.scala: |
    class InteractiveTests extends munit.FunSuite:
      test("entry point reads commands until quit") {
        val input = new java.io.ByteArrayInputStream("add Read book\nlist\ndone 1\nlist\nquit\n".getBytes("UTF-8"))
        val output = new java.io.ByteArrayOutputStream()
        Console.withIn(input) { Console.withOut(output) { Main.main(Array("--interactive")) } }
        val lines = output.toString("UTF-8").linesIterator.map(_.stripPrefix("> ")).filter(_.nonEmpty).toList
        assertEquals(lines, List("Added 1", "1 [ ] Read book", "Completed", "1 [x] Read book", "Bye"))
      }
      test("end of file exits without a command") {
        val input = new java.io.ByteArrayInputStream(Array.emptyByteArray)
        val output = new java.io.ByteArrayOutputStream()
        Console.withIn(input) { Console.withOut(output) { Main.main(Array("--interactive")) } }
        assertEquals(output.toString("UTF-8").stripPrefix("> ").trim, "")
      }
