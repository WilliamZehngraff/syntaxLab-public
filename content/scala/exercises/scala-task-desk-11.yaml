solution:
  Main.scala: |
    def banner: String = "Task Desk ready"
    val owner: String = "Learner"
    val capacity: Int = 10
    def welcome: String = s"$owner has room for $capacity tasks"
    def taskLabel(title: String, done: Boolean = false): String =
      val mark = if done then "x" else " "
      s"[$mark] $title"
    def titleFrom(args: Array[String]): String = if args.isEmpty then "Untitled" else args.mkString(" ")
    def addTitle(titles: Vector[String], title: String): Vector[String] = titles :+ title
    def listTitles(titles: Vector[String]): String = titles.map(t => taskLabel(t)).mkString("\n")
    def commandKind(word: String): String = word match
      case "add" => "add"
      case "list" => "list"
      case "done" => "done"
      case "quit" => "quit"
      case _ => "unknown"
    def execute(board: Board, line: String): String =
      val text = line.trim
      if text.startsWith("add ") && text.drop(4).trim.nonEmpty then
        s"Added ${board.add(text.drop(4).trim).id}"
      else if text == "list" then
        board.tasks.map(t => s"${t.id} ${taskLabel(t.title, t.done)}").mkString("\n")
      else if text.startsWith("done ") then
        text.drop(5).trim.toIntOption match
          case Some(id) => if board.complete(id) then "Completed" else "Not found"
          case None => "Invalid command"
      else if text == "quit" then "Bye"
      else "Invalid command"
    object Main:
      def main(args: Array[String]): Unit =
        if args.contains("--interactive") then
          val board = new Board()
          var running = true
          while running do
            val line = scala.io.StdIn.readLine("> ")
            if line == null then running = false
            else
              println(execute(board, line))
              if line.trim == "quit" then running = false
        else if args.isEmpty then println(banner)
        else println(taskLabel(titleFrom(args)))
  Task.scala: |
    // Immutable task model.
    case class Task(id: Int, title: String, done: Boolean = false)
    def completeTask(task: Task): Task = task.copy(done = true)
  Board.scala: |
    // Owns one independent collection.
    class Board(val name: String):
      def this() = this("Inbox")
      private var stored = Vector.empty[Task]
      def tasks: Vector[Task] = stored
      def add(title: String): Task =
        val task = Task(stored.size + 1, title)
        stored = stored :+ task
        task
      def find(id: Int): Option[Task] = stored.find(_.id == id)
      def complete(id: Int): Boolean =
        if find(id).isEmpty then false
        else
          stored = stored.map(t => if t.id == id then completeTask(t) else t)
          true
  Learner.test.scala: |
    class LearnerTests extends munit.FunSuite:
      test("invalid command and isolated boards") {
        val first = new Board()
        assertEquals(execute(first, "?"), "Invalid command")
        execute(first, "add A")
        assertEquals(new Board().tasks.size, 0)
      }
