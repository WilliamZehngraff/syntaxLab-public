id: scala-functions-overloads
language: scala
module: functions
title: 06 · Overloaded methods
order: 130
prerequisites:
- scala-functions-defaults
concepts:
- overloading
- types
- functions
assignment: |
  Define two `double` functions: one accepts Int and returns twice it; one accepts String and returns
  two concatenated copies. Give explicit result types and demonstrate both from a main.

  ## Workflow
  Create `Main.scala` yourself. No learner source is supplied.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
docs: scala/docs/functions.md
hints:
- The parameter types must distinguish overloads.
- A return type alone cannot distinguish two same-parameter overloads.
files:
  project.scala: |
    //> using scala "3.3.7"
    //> using test.dep "org.scalameta::munit:1.0.4"
  Exercise.test.scala: |
    class ExerciseTests extends munit.FunSuite:
      test("overloads") { assertEquals(double(-3), -6); assertEquals(double("ab"), "abab"); assertEquals(double(""), "") }
  ASSIGNMENT.md: |
    Define two `double` functions: one accepts Int and returns twice it; one accepts String and returns
    two concatenated copies. Give explicit result types and demonstrate both from a main.

    ## Workflow
    Create `Main.scala` yourself. No learner source is supplied.

    ```sh
    scala-cli run .
    scala-cli test .
    syntaxlab check
    ```
checks:
- type: file
  path: Main.scala
  label: Main.scala exists
- type: command
  args:
  - $scala
  - test
  - .
  - --server=false
  timeout: 240
  label: Scala compilation and MUnit behavior tests
- type: command
  args:
  - $scala
  - run
  - .
  - --server=false
  timeout: 240
  label: Application entry point runs
solution:
  Main.scala: |
    def double(n: Int): Int = n * 2
    def double(s: String): String = s + s
    @main def demo(): Unit = println(double("ha"))
project: ''
difficulty: 2
