id: scala-match-basic
language: scala
module: pattern-matching
title: 01 · Constants and wildcard
order: 240
prerequisites:
- scala-map-filter
concepts:
- match
- constants
- wildcard
assignment: |
  Write `def commandHelp(command: String): String` using match: add → Create a task; list → Show tasks;
  quit → Exit; anything else → Unknown command. Match case-sensitively. Add a main.

  ## Workflow
  Create `Main.scala` yourself. No learner source is supplied.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
docs: scala/docs/pattern-matching.md
hints:
- Put the wildcard case last.
- Each case produces the function's String result.
files:
  project.scala: |
    //> using scala "3.3.7"
    //> using test.dep "org.scalameta::munit:1.0.4"
  Exercise.test.scala: |
    class ExerciseTests extends munit.FunSuite:
      test("commands") { assertEquals(commandHelp("add"), "Create a task"); assertEquals(commandHelp("list"), "Show tasks"); assertEquals(commandHelp("quit"), "Exit"); assertEquals(commandHelp("ADD"), "Unknown command") }
  ASSIGNMENT.md: |
    Write `def commandHelp(command: String): String` using match: add → Create a task; list → Show tasks;
    quit → Exit; anything else → Unknown command. Match case-sensitively. Add a main.

    ## Workflow
    Create `Main.scala` yourself. No learner source is supplied.

    ```sh
    scala-cli run .
    scala-cli test .
    syntaxlab check
    ```
checks:
- type: file
  path: Main.scala
  label: Main.scala exists
- type: command
  args:
  - $scala
  - test
  - .
  - --server=false
  timeout: 240
  label: Scala compilation and MUnit behavior tests
- type: command
  args:
  - $scala
  - run
  - .
  - --server=false
  timeout: 240
  label: Application entry point runs
- type: construct
  path: Main.scala
  pattern: \bmatch\b
  label: Required lesson construct (heuristic; behavior checked above)
solution:
  Main.scala: |
    def commandHelp(command: String): String = command match
      case "add" => "Create a task"
      case "list" => "Show tasks"
      case "quit" => "Exit"
      case _ => "Unknown command"
    @main def demo(): Unit = println(commandHelp("list"))
project: ''
difficulty: 3
