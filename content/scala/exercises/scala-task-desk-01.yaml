assignment: |
  Create Task Desk with top-level `def banner: String` returning `Task Desk ready`. Define object Main's main method to print banner. This is the permanent project directory.

  ## Workflow
  Create `Main.scala` yourself. Keep all previously implemented behavior.

  ```sh
  scala-cli run .
  scala-cli test .
  syntaxlab check
  ```
docs: scala/docs/projects.md
hints:
- Keep earlier tests green while introducing the new behavior.
- Review the foundations reference, then separate calculation from input/output.
files:
  project.scala: |
    //> using scala "3.3.7"
    //> using test.dep "org.scalameta::munit:1.0.4"
  Stage01.test.scala: |
    class Stage01Tests extends munit.FunSuite:
      test("stage 01 contract") { assertEquals(banner, "Task Desk ready") }
  STAGE-01.md: |
