checks:
- type: file
  path: main.py
  label: Learner main.py exists
- type: command
  args:
  - $python
  - -m
  - unittest
  - discover
  - -s
  - tests
  - -v
  label: Python behavior tests (unittest)
- type: command
  args:
  - $python
  - main.py
  label: Application runs
  stdin: ''
solution:
  main.py: |
    age = 20
    has_ticket = True
    print(age >= 18 and has_ticket)
    print(bool(""))
project: ''
