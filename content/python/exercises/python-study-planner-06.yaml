solution:
  main.py: |
    def banner() -> str:
        return "Study Planner ready"


    def remaining(used: int) -> int:
        return 10 - used

    def task_label(title: str, done: bool = False) -> str:
        mark = "x" if done else " "
        return f"[{mark}] {title}"

    def add_title(titles: list[str], title: str) -> list[str]:
        return titles + [title]

    def make_record(identifier: int, title: str) -> dict:
        return {"id": identifier, "title": title, "done": False}

    from dataclasses import dataclass, replace

    @dataclass(frozen=True)
    class Task:
        id: int
        title: str
        done: bool = False

    class Planner:
        def __init__(self, name: str = "Inbox"):
            self.name = name
            self._tasks = []

        def tasks(self) -> list[Task]:
            return self._tasks.copy()

        def add(self, title: str) -> Task:
            next_id = 1
            for task in self._tasks:
                next_id = max(next_id, task.id + 1)
            task = Task(next_id, title)
            self._tasks.append(task)
            return task

    if __name__ == "__main__":
        print(banner())
