assignment: |
  Add an argparse CLI: `list FILE` prints `ID [ ] TITLE` or `ID [x] TITLE` per task; `add FILE TITLE` validates a nonblank title, saves, and prints `Added ID`; `done FILE ID` completes/saves an existing task and prints `Completed`. No arguments prints the original banner. Invalid arguments, missing IDs, corrupt data and I/O failures must exit nonzero with a stderr diagnostic. Do not overwrite a corrupt file on failure. Preserve all earlier imported APIs. Add tests/test_learner.py with your own error-path test; the supplied CLI tests use real subprocesses and temporary files.

  ## Workflow
  Create `main.py` yourself. Extend the same project; preserve earlier APIs and stage tests.
  Read `syntaxlab docs python projects` for syntax and independent examples.

  ```sh
  python3 main.py
  python3 -m unittest discover -s tests -v
  syntaxlab check
  ```
