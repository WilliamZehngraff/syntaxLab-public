  tests/test_cli.py: |
    import subprocess
    import sys
    import tempfile
    import unittest
    from pathlib import Path

    class CliTests(unittest.TestCase):
        def test_persistent_cli(self):
            with tempfile.TemporaryDirectory() as folder:
                path = Path(folder) / "tasks.json"
                def call(*arguments, success=True):
                    result = subprocess.run([sys.executable, "main.py", *map(str, arguments)],
                                            capture_output=True, text=True, timeout=5)
                    self.assertEqual(result.returncode == 0, success, result.stderr)
                    if not success:
                        self.assertTrue(result.stderr)
                    return result.stdout.strip()
                self.assertEqual(call("list", path), "")
                self.assertEqual(call("add", path, "Read café"), "Added 1")
                self.assertEqual(call("add", path, "Write tests"), "Added 2")
                self.assertEqual(call("done", path, 1), "Completed")
                self.assertEqual(call("list", path), "1 [x] Read café\n2 [ ] Write tests")
                call("done", path, 99, success=False)
                call("done", path, "oops", success=False)
                call("add", path, " ", success=False)
                call("unknown", path, success=False)
                path.write_text("broken", encoding="utf-8")
                call("add", path, "Keep old data", success=False)
                self.assertEqual(path.read_text(encoding="utf-8"), "broken")
