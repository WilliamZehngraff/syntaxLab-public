    import contextlib
    import importlib
    import io
    import json
    import subprocess
    import sys
    import tempfile
    import unittest
    from pathlib import Path
    import main as learner

    class ExerciseTests(unittest.TestCase):
        def test_json_contract(self):
            with tempfile.TemporaryDirectory() as folder:
                path = Path(folder) / "data.json"
                records = [{"title": "café", "count": 2}, {}]
                learner.save_records(path, records)
                self.assertEqual(learner.load_records(path), records)
                for bad in ["{}", "[1]", "not json"]:
                    path.write_text(bad, encoding="utf-8")
                    with self.assertRaises(ValueError):
                        learner.load_records(path)
