assignment: |
  Define save_records(path, records: list[dict]) -> None, storing UTF-8 JSON, and load_records(path) -> list[dict]. Loading must reject anything other than a list of dictionaries with ValueError; let malformed JSON and I/O errors propagate. Preserve record values on round-trip. Add an import-safe, non-writing demo.

  ## Workflow
  Create `main.py` yourself. No learner implementation is supplied.
  Read `syntaxlab docs python file-io` for syntax and independent examples.

  ```sh
  python3 main.py
  python3 -m unittest discover -s tests -v
  syntaxlab check
  ```
