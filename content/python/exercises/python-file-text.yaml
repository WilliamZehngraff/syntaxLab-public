assignment: |
  Define write_lines(path, lines: list[str]) -> None and read_lines(path) -> list[str]. Write UTF-8 with one newline per input string, and read with splitlines. Input strings contain no newlines. Empty input writes an empty file. Accept pathlib.Path or string paths, propagate I/O failures, and add a harmless demo that does not write files automatically.

  ## Workflow
  Create `main.py` yourself. No learner implementation is supplied.
  Read `syntaxlab docs python file-io` for syntax and independent examples.

  ```sh
  python3 main.py
  python3 -m unittest discover -s tests -v
  syntaxlab check
  ```
docs: python/docs/file-io.md
hints:
- Path.read_text/write_text manage opening and closing for you.
- Use temporary directories in tests so you never depend on personal files.
files:
  tests/test_exercise.py: |
    import contextlib
    import importlib
    import io
    import json
    import subprocess
    import sys
    import tempfile
    import unittest
    from pathlib import Path
    import main as learner

    class ExerciseTests(unittest.TestCase):
        def test_roundtrip_and_missing_file(self):
            with tempfile.TemporaryDirectory() as folder:
                path = Path(folder) / "notes.txt"
                learner.write_lines(path, ["café", "", "notes"])
                self.assertEqual(learner.read_lines(path), ["café", "", "notes"])
                self.assertEqual(path.read_text(encoding="utf-8"), "café\n\nnotes\n")
                learner.write_lines(path, [])
                self.assertEqual(learner.read_lines(path), [])
                with self.assertRaises(FileNotFoundError):
                    learner.read_lines(Path(folder) / "missing")
