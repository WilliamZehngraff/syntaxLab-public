solution:
  main.py: |
    def parse_age(text: str) -> int | None:
        try:
            age = int(text.strip())
        except ValueError:
            return None
        return age if 0 <= age <= 130 else None

    if __name__ == "__main__":
        print(parse_age(" 42 "))
