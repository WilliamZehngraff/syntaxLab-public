assignment: |
  Add dumps_tasks(tasks: list[Task]) -> str and loads_tasks(text: str) -> list[Task]. JSON is a list of records with exactly id/title/done. Require positive unique integer IDs (not bools), nonblank string titles and bool done. Preserve record order and title text. Reject malformed JSON or invalid records with ValueError. Do not silently discard invalid records.

  ## Workflow
