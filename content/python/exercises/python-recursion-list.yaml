  label: Required lesson construct (heuristic; behavior tested separately)
solution:
  main.py: |
    def total(values: list[int]) -> int:
        if not values:
            return 0
        return values[0] + total(values[1:])

    if __name__ == "__main__":
        print(total([2, -3, 8]))
project: ''
