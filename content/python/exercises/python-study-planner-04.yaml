assignment: |
  Add add_title(titles: list[str], title: str) -> list[str], returning a new list with title appended. Preserve the caller's list and ordering, including repeated titles. Use this to practice independent state before adding classes.

  ## Workflow
  Create `main.py` yourself. Extend the same project; preserve earlier APIs and stage tests.
  Read `syntaxlab docs python projects` for syntax and independent examples.

  ```sh
  python3 main.py
  python3 -m unittest discover -s tests -v
  syntaxlab check
  ```
docs: python/docs/projects.md
hints:
- Keep earlier stage tests green while adding the new behavior.
- Separate the data calculation from file and terminal I/O; test failure paths deliberately.
files:
  tests/test_04.py: |
    import contextlib
    import importlib
    import io
    import json
    import subprocess
    import sys
    import tempfile
    import unittest
    from pathlib import Path
    import main as learner

    class ExerciseTests(unittest.TestCase):
        def test_stage_contract(self):
            before = ["A"]
            result = learner.add_title(before, "B")
            self.assertEqual(result, ["A", "B"])
            self.assertEqual(before, ["A"])
            result.append("C")
            self.assertEqual(before, ["A"])
