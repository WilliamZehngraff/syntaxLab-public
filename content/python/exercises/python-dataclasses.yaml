solution:
  main.py: |
    from dataclasses import dataclass, replace

    @dataclass(frozen=True)
    class Book:
        title: str
        pages: int

    def retitle(book: Book, title: str) -> Book:
        return replace(book, title=title)

    if __name__ == "__main__":
        print(retitle(Book("Old", 20), "New"))
project: ''
