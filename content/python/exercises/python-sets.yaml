checks:
- type: file
  path: main.py
  label: Learner main.py exists
- type: command
  args:
  - $python
  - -c
  - import main
  label: Import has no I/O side effects
  stdout: ''
- type: command
  args:
  - $python
  - -m
  - unittest
  - discover
  - -s
  - tests
  - -v
  label: Python behavior tests (unittest)
- type: command
  args:
  - $python
  - main.py
  label: Application runs
  stdin: ''
solution:
  main.py: |
    def unique_sorted(values: list[int]) -> list[int]:
        return sorted(set(values))

    if __name__ == "__main__":
        print(unique_sorted([4, 1, 4, 2]))
project: ''
