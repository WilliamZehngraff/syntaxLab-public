  - $python
  - -c
  - import main
  label: Import has no I/O side effects
  stdout: ''
- type: command
  args:
  - $python
  - -m
  - unittest
  - discover
  - -s
  - tests
  - -v
  label: Python behavior tests (unittest)
- type: command
  args:
  - $python
  - main.py
  label: Application runs
  stdin: ''
solution:
  main.py: |
    def reversed_copy(values: list[int]) -> list[int]:
        return values[::-1]

    if __name__ == "__main__":
        print(reversed_copy([1, 2, 3]))
project: ''
