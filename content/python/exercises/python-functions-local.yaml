  - $python
  - -m
  - unittest
  - discover
  - -s
  - tests
  - -v
  label: Python behavior tests (unittest)
- type: command
  args:
  - $python
  - main.py
  label: Application runs
  stdin: ''
- type: construct
  path: main.py
  pattern: (?s)def square_sum.*\n\s+def square
  label: Required lesson construct (heuristic; behavior tested separately)
solution:
  main.py: |
    def square_sum(a: int, b: int) -> int:
        def square(n: int) -> int:
            return n * n
        return square(a) + square(b)

    if __name__ == "__main__":
        print(square_sum(3, 4))
project: ''
