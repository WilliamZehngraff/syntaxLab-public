id: python-text
language: python
module: foundations
title: 04 · Strings and independent values
order: 40
prerequisites:
- python-numbers
concepts:
- str
- methods
- immutability
- len
- f-strings
difficulty: 1
assignment: |
  Set name to `  Ada  `. Strip its outer whitespace into a new name, uppercase that result, and print `ADA has 3 letters`. Preserve the original binding. Use len and an f-string, not a literal answer. Strings are immutable: methods return new strings.

  ## Workflow
  Create `main.py` yourself. No learner implementation is supplied.
  Read `syntaxlab docs python foundations` for syntax and independent examples.

  ```sh
  python3 main.py
  python3 -m unittest discover -s tests -v
  syntaxlab check
  ```
docs: python/docs/foundations.md
hints:
- str.strip removes outer whitespace, not spaces in the middle.
- Store the returned string; calling a method does not mutate the original.
files:
  tests/test_exercise.py: |
    import contextlib
    import importlib
    import io
    import json
    import subprocess
    import sys
    import tempfile
    import unittest
    from pathlib import Path

    class ExerciseTests(unittest.TestCase):
        def test_program_output(self):
            result = subprocess.run([sys.executable, "main.py"], input='', capture_output=True, text=True, timeout=5)
            self.assertEqual(result.returncode, 0, result.stderr)
            self.assertEqual(result.stdout, 'ADA has 3 letters\n')
  ASSIGNMENT.md: |
    Set name to `  Ada  `. Strip its outer whitespace into a new name, uppercase that result, and print `ADA has 3 letters`. Preserve the original binding. Use len and an f-string, not a literal answer. Strings are immutable: methods return new strings.

    ## Workflow
    Create `main.py` yourself. No learner implementation is supplied.
    Read `syntaxlab docs python foundations` for syntax and independent examples.

    ```sh
    python3 main.py
    python3 -m unittest discover -s tests -v
    syntaxlab check
    ```
checks:
- type: file
  path: main.py
  label: Learner main.py exists
- type: command
  args:
  - $python
  - -m
  - unittest
  - discover
  - -s
  - tests
  - -v
  label: Python behavior tests (unittest)
- type: command
  args:
  - $python
  - main.py
  label: Application runs
  stdin: ''
solution:
  main.py: |
    name = "  Ada  "
    cleaned = name.strip().upper()
    print(f"{cleaned} has {len(cleaned)} letters")
project: ''
