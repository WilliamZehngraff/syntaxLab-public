solution:
  main.py: |
    def digit_count(n: int) -> int:
        count = 1
        # Dividing by ten moves toward a one-digit value.
        while n >= 10:
            n //= 10
            count += 1
        return count

    if __name__ == "__main__":
        print(digit_count(1200))
project: ''
