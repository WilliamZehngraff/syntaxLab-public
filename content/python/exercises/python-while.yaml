assignment: |
  Write digit_count(n: int) -> int using a while loop for nonnegative integers. Zero has one digit. Repeatedly remove a decimal digit without converting n to a string. Include a main-guarded demo and explain why the loop terminates in a comment.

  ## Workflow
  Create `main.py` yourself. No learner implementation is supplied.
  Read `syntaxlab docs python control-flow` for syntax and independent examples.

  ```sh
  python3 main.py
  python3 -m unittest discover -s tests -v
  syntaxlab check
  ```
docs: python/docs/control-flow.md
hints:
- Handle the zero case deliberately.
- Each division by ten removes one trailing decimal digit.
