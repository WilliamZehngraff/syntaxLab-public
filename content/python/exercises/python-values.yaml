  - $python
  - main.py
  label: Application runs
  stdin: ''
solution:
  main.py: |
    minutes_per_hour = 60
    hours_per_day = 12
    hours_per_day = 24
    minutes_per_day = minutes_per_hour * hours_per_day
    print(f"Minutes: {minutes_per_day}")
project: ''
