  path: main.py
  label: Learner main.py exists
- type: command
  args:
  - $python
  - -m
  - unittest
  - discover
  - -s
  - tests
  - -v
  label: Python behavior tests (unittest)
- type: command
  args:
  - $python
  - main.py
  label: Application runs
  stdin: ''
solution:
  main.py: |
    # int truncates toward zero; // rounds down.
    print(7 / 2, 7 // 2, 7 % 2)
project: ''
