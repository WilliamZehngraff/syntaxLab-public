assignment: |
  Add remaining(used: int) -> int returning 10 - used for used in 0..10. Put printing behind a main guard so importing main is silent, while running main.py still prints the original banner. This establishes a calculation that later features can reuse.

  ## Workflow
  Create `main.py` yourself. Extend the same project; preserve earlier APIs and stage tests.
  Read `syntaxlab docs python projects` for syntax and independent examples.

  ```sh
  python3 main.py
  python3 -m unittest discover -s tests -v
  syntaxlab check
  ```
docs: python/docs/projects.md
hints:
- Keep earlier stage tests green while adding the new behavior.
- Separate the data calculation from file and terminal I/O; test failure paths deliberately.
files:
