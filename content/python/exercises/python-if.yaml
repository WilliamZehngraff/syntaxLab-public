id: python-if
language: python
module: control-flow
title: 01 · If, elif, else
order: 110
prerequisites:
- python-functions-local
concepts:
- if
- elif
- else
- boundaries
difficulty: 2
assignment: |
  Write clamp(value: int, low: int, high: int) -> int returning low below the interval, high above it, and value inside it. Endpoints are inclusive and low <= high. Use conditional statements and include a main-guarded demo.

  ## Workflow
  Create `main.py` yourself. No learner implementation is supplied.
  Read `syntaxlab docs python control-flow` for syntax and independent examples.

  ```sh
  python3 main.py
  python3 -m unittest discover -s tests -v
  syntaxlab check
  ```
docs: python/docs/control-flow.md
hints:
- Check both boundaries, not only a middle value.
- An early return ends this call, not the whole program.
