  - $python
  - main.py
  label: Application runs
  stdin: ''
solution:
  main.py: |
    def clamp(value: int, low: int, high: int) -> int:
        if value < low:
            return low
        elif value > high:
            return high
        else:
            return value

    if __name__ == "__main__":
        print(clamp(12, 0, 10))
project: ''
