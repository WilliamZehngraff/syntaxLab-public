    Write clamp(value: int, low: int, high: int) -> int returning low below the interval, high above it, and value inside it. Endpoints are inclusive and low <= high. Use conditional statements and include a main-guarded demo.

    ## Workflow
    Create `main.py` yourself. No learner implementation is supplied.
    Read `syntaxlab docs python control-flow` for syntax and independent examples.

    ```sh
