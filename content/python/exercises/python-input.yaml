checks:
- type: file
  path: main.py
  label: Learner main.py exists
- type: command
  args:
  - $python
  - -m
  - unittest
  - discover
  - -s
  - tests
  - -v
  label: Python behavior tests (unittest)
- type: command
  args:
  - $python
  - main.py
  label: Application runs
  stdin: "  Lin  \n"
solution:
  main.py: |
    name = input().strip()
    print(f"Welcome, {name}!")
project: ''
