assignment: |
  Write recursive factorial(n: int) -> int for 0..100. Return 1 for zero and recurse on a smaller number. Do not use math.factorial or loops. Add a main-guarded demo and a comment explaining why the recursion reaches its base case.

  ## Workflow
  Create `main.py` yourself. No learner implementation is supplied.
  Read `syntaxlab docs python recursion` for syntax and independent examples.

  ```sh
  python3 main.py
  python3 -m unittest discover -s tests -v
  syntaxlab check
  ```
docs: python/docs/recursion.md
hints:
- Which input requires no smaller problem?
- Python does not eliminate tail calls; these exercises deliberately bound the input.
