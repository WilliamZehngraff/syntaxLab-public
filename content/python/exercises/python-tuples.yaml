solution:
  main.py: |
    def quotient_remainder(n: int, divisor: int) -> tuple[int, int]:
        return n // divisor, n % divisor

    if __name__ == "__main__":
        quotient, remainder = quotient_remainder(17, 5)
        print(quotient, remainder)
project: ''
