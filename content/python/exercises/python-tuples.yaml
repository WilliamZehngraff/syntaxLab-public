id: python-tuples
language: python
module: collections
title: 04 · Return and unpack a tuple
order: 180
prerequisites:
- python-sets
concepts:
- tuple
- unpacking
- return-values
difficulty: 3
assignment: |
  Write quotient_remainder(n: int, divisor: int) -> tuple[int, int], returning quotient and remainder for n >= 0 and divisor > 0. Add a main-guarded demo that unpacks the result into two names. A tuple groups values without introducing a new class.

  ## Workflow
  Create `main.py` yourself. No learner implementation is supplied.
  Read `syntaxlab docs python collections` for syntax and independent examples.

  ```sh
  python3 main.py
  python3 -m unittest discover -s tests -v
  syntaxlab check
  ```
docs: python/docs/collections.md
hints:
- A comma creates a tuple; parentheses often make it clearer.
- The caller can unpack the two components with two names on the left of =.
files:
  tests/test_exercise.py: |
