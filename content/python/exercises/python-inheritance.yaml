solution:
  main.py: |
    class Greeter:
        def name(self) -> str:
            raise NotImplementedError

        def greeting(self) -> str:
            return f"Hello, {self.name()}"

    class Person(Greeter):
        def __init__(self, name: str):
            self._name = name

        def name(self) -> str:
            return self._name

    if __name__ == "__main__":
        print(Person("Ada").greeting())
