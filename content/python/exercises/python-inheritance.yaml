assignment: |
  Define Greeter with name(self) raising NotImplementedError and greeting(self) returning `Hello, NAME` by calling self.name(). Define Person(Greeter), initialized with a name string, overriding name(). Include an import-safe demo. Reuse greeting instead of duplicating it.

  ## Workflow
  Create `main.py` yourself. No learner implementation is supplied.
  Read `syntaxlab docs python oop` for syntax and independent examples.

  ```sh
  python3 main.py
  python3 -m unittest discover -s tests -v
  syntaxlab check
  ```
docs: python/docs/oop.md
hints:
- A call to self.name uses the subclass's implementation.
- A leading underscore signals an internal attribute by convention, not access enforcement.
files:
  tests/test_exercise.py: |
    import contextlib
    import importlib
    import io
    import json
    import subprocess
    import sys
    import tempfile
    import unittest
    from pathlib import Path
    import main as learner

    class ExerciseTests(unittest.TestCase):
        def test_polymorphism(self):
            person = learner.Person("Lin")
            self.assertIsInstance(person, learner.Greeter)
            self.assertEqual(person.name(), "Lin")
            self.assertEqual(person.greeting(), "Hello, Lin")
            with self.assertRaises(NotImplementedError):
                learner.Greeter().name()
