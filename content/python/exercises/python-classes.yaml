solution:
  main.py: |
    class Counter:
        def __init__(self, start: int = 0):
            self.value = start

        def increment(self) -> None:
            self.value += 1

    if __name__ == "__main__":
        counter = Counter(3)
        counter.increment()
        print(counter.value)
