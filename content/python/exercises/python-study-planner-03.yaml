assignment: |
  Add task_label(title: str, done: bool = False) -> str returning `[ ] TITLE` when unfinished or `[x] TITLE` when done. Preserve title whitespace. Keep earlier behavior and main's banner; use a conditional expression or if/else.

  ## Workflow
  Create `main.py` yourself. Extend the same project; preserve earlier APIs and stage tests.
  Read `syntaxlab docs python projects` for syntax and independent examples.

  ```sh
  python3 main.py
  python3 -m unittest discover -s tests -v
  syntaxlab check
  ```
