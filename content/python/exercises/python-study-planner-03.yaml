solution:
  main.py: |
    def banner() -> str:
        return "Study Planner ready"


    def remaining(used: int) -> int:
        return 10 - used

    def task_label(title: str, done: bool = False) -> str:
        mark = "x" if done else " "
        return f"[{mark}] {title}"

    if __name__ == "__main__":
        print(banner())
