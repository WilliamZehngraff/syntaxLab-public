  - $python
  - -m
  - unittest
  - discover
  - -s
  - tests
  - -v
  label: Python behavior tests (unittest)
- type: command
  args:
  - $python
  - main.py
  label: Application runs
  stdin: ''
solution:
  main.py: |
    def rectangle_area(width: int, height: int) -> int:
        return width * height

    if __name__ == "__main__":
        print(rectangle_area(3, 8))
project: ''
