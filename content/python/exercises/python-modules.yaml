id: python-modules
language: python
module: organization
title: 01 · Split reusable code from the entry point
order: 260
prerequisites:
- python-inheritance
concepts:
- modules
- imports
- main-guard
- separation-of-responsibilities
difficulty: 4
assignment: |
  Create text_tools.py defining heading(text: str) -> str, returning trimmed uppercase text. In main.py import heading and use it in a guarded demo. Importing either module must be silent. Do not duplicate the implementation in the entry point; tests import your module directly.

  ## Workflow
  Create `main.py` yourself. No learner implementation is supplied.
  Read `syntaxlab docs python organization` for syntax and independent examples.

  ```sh
  python3 main.py
  python3 -m unittest discover -s tests -v
  syntaxlab check
  ```
docs: python/docs/organization.md
hints:
- The file name text_tools.py supplies the import name text_tools.
- Keep the calculation in the reusable module and the printing at the entry point.
files:
  tests/test_exercise.py: |
    import contextlib
    import importlib
    import io
    import json
    import subprocess
    import sys
    import tempfile
    import unittest
    from pathlib import Path
    import main as learner

    class ExerciseTests(unittest.TestCase):
        def test_module_interface(self):
            from text_tools import heading
            self.assertEqual(heading(" report "), "REPORT")
            self.assertEqual(heading(""), "")
            self.assertIs(learner.heading, heading)
  ASSIGNMENT.md: |
    Create text_tools.py defining heading(text: str) -> str, returning trimmed uppercase text. In main.py import heading and use it in a guarded demo. Importing either module must be silent. Do not duplicate the implementation in the entry point; tests import your module directly.

    ## Workflow
    Create `main.py` yourself. No learner implementation is supplied.
    Read `syntaxlab docs python organization` for syntax and independent examples.

    ```sh
    python3 main.py
    python3 -m unittest discover -s tests -v
    syntaxlab check
    ```
checks:
- type: file
  path: main.py
  label: Learner main.py exists
- type: command
  args:
  - $python
  - -c
  - import main
  label: Import has no I/O side effects
  stdout: ''
- type: command
  args:
  - $python
  - -m
  - unittest
  - discover
  - -s
  - tests
  - -v
  label: Python behavior tests (unittest)
- type: command
  args:
  - $python
  - main.py
  label: Application runs
  stdin: ''
solution:
  main.py: |
    from text_tools import heading

    if __name__ == "__main__":
        print(heading(" report "))
  text_tools.py: |
    def heading(text: str) -> str:
        return text.strip().upper()
project: ''
