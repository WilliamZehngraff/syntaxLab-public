id: python-for
language: python
module: control-flow
title: 02 · For and range
order: 120
prerequisites:
- python-if
concepts:
- for
- range
- accumulation
difficulty: 2
assignment: |
  Write sum_to(n: int) -> int using for/range, summing 1 through n. Inputs are 0..1000 and sum_to(0) is 0. Do not use sum. Keep the total local and add an import-safe demo.

  ## Workflow
  Create `main.py` yourself. No learner implementation is supplied.
  Read `syntaxlab docs python control-flow` for syntax and independent examples.

  ```sh
  python3 main.py
  python3 -m unittest discover -s tests -v
  syntaxlab check
  ```
docs: python/docs/control-flow.md
hints:
- range excludes its stop value.
- Initialize a total before the loop and return after the loop.
