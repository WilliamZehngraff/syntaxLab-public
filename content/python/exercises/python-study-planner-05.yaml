    class ExerciseTests(unittest.TestCase):
        def test_stage_contract(self):
            self.assertEqual(learner.make_record(3, "Read"), {"id": 3, "title": "Read", "done": False})
            a = learner.make_record(1, "A")
            b = learner.make_record(1, "A")
            a["done"] = True
            self.assertFalse(b["done"])
