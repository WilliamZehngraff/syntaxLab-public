difficulty: 3
assignment: |
  Write frequencies(words: list[str]) -> dict[str, int] counting each distinct string. Matching is case-sensitive. Empty input gives an empty dictionary. Reuse loops and dictionary lookup rather than collections.Counter; add an import-safe demo.

  ## Workflow
  Create `main.py` yourself. No learner implementation is supplied.
  Read `syntaxlab docs python collections` for syntax and independent examples.

  ```sh
  python3 main.py
  python3 -m unittest discover -s tests -v
  syntaxlab check
  ```
docs: python/docs/collections.md
hints:
- A missing key needs an initial count.
- dict.get can supply a fallback without modifying the dictionary.
