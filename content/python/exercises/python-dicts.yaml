solution:
  main.py: |
    def frequencies(words: list[str]) -> dict[str, int]:
        counts = {}
        for word in words:
            counts[word] = counts.get(word, 0) + 1
        return counts

    if __name__ == "__main__":
        print(frequencies(["a", "b", "a"]))
project: ''
